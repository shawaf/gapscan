[project]
name = "gapscan-security"
version = "1.0.0"
description = "Security domain pack: scanners, own rules, taint, reachability, OWASP target packs, the review agent and the dashboard."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "gapscan-engine",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
pdf = ["playwright>=1.40"]

[project.entry-points."gapscan.packs"]
security = "gapscan.security_pack:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gapscan"]

