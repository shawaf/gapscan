              - pattern-either:
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) = $E
                  - pattern-inside: |
