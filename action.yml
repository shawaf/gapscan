# GapScan GitHub Action: scan a pull request, upload the results to the Security tab, comment on
# the PR, and optionally send the report to your GapScan project. A thin wrapper over the CLI
# (`gapscan ci run` / `ci comment` / `team push`); the engine makes no network call during the scan.
#
# Usage (see docs/github-action.md):
#   - uses: actions/checkout@v4
#     with: { fetch-depth: 0 }        # the diff against the base branch needs history
#   - uses: <owner>/gapscan@v1
#     with:
#       base: ${{ github.base_ref }}
#
# The runner must have `gapscan` on PATH. On a self-hosted runner install the offline bundle; on a
# hosted runner pass `install:` with the command that installs it (e.g. a pip install or a release
# download). Values from the event reach the shell through env only, never interpolated into a script.
name: GapScan
description: Find, prove and prioritize security gaps against OWASP, in your pull requests.
branding:
  icon: shield
  color: blue
inputs:
  target:
    description: Directory to scan.
    default: "."
  base:
    description: Base git ref to diff against (e.g. the PR base branch); empty scans everything.
    default: ""
  comment:
    description: Post the findings as a pull-request comment.
    default: "true"
  upload-sarif:
    description: Upload SARIF to the GitHub Security tab (needs security-events:write).
    default: "true"
  sarif-category:
    description: Code-scanning category for the SARIF upload.
    default: gapscan
  github-token:
    description: Token used to post the PR comment.
    default: ${{ github.token }}
  install:
    description: Shell command to install gapscan before scanning (empty = already on PATH).
    default: ""
runs:
  using: composite
  steps:
    - name: Install gapscan
      if: inputs.install != ''
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
      run: eval "$INSTALL"
    - name: Scan
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        BASE: ${{ inputs.base }}
      run: >
        gapscan ci run "$TARGET" ${BASE:+--base "origin/$BASE"}
        --comment gapscan-comment.md --out gapscan-findings.json --sarif gapscan.sarif
    - name: Upload SARIF to the Security tab
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@0fda7a646fd14a20daf520829ca1ae8847000819 # codeql-bundle-v2.27.3
      with:
        sarif_file: gapscan.sarif
        category: ${{ inputs.sarif-category }}
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event.pull_request.number != ''
      shell: bash
      env:
        GAPSCAN_SCM_TOKEN: ${{ inputs.github-token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: >
        gapscan ci comment gapscan-comment.md --provider github
        --url "$API_URL" --repo "$REPO" --pr "$PR_NUMBER"
    - name: Save the findings as an artifact
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gapscan-findings
        path: gapscan-findings.json
