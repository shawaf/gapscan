              - metavariable-regex:
                  metavariable: $A
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|MatrixVariable|RequestPart|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $P
          # servlet requests and WebFlux functional handlers
          - pattern: $R.getParameter(...)
          - pattern: $R.getParameterValues(...)
          - pattern: $R.parameterMap
          - pattern: $R.getHeader(...)
          - pattern: $R.queryString
          - pattern: $R.getQueryString()
          - pattern: $R.queryParam(...)
          - pattern: $R.pathVariable(...)
          - pattern: $R.queryParams()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $ENG.eval($X, ...)
              - pattern: $P.parseExpression($X, ...)
              - pattern: Ognl.getValue($X, ...)
              - pattern: MVEL.eval($X, ...)
              - pattern: GroovyShell(...).evaluate($X, ...)
              - pattern: $G.evaluate($X, ...)
          - focus-metavariable: $X

  - id: gapscan.kotlin.jwt-unverified
    languages: [kotlin]
    severity: ERROR
    message: >-
      A JSON Web Token is accepted without checking its signature: the `none` algorithm, an unsecured (unsigned) parser,
      or `JWT.decode` in a function that never verifies. Anyone can then write a token with any user or role in it.
      Verify every token with a fixed algorithm and key (`JWT.require(Algorithm.HMAC256(key)).build().verify(token)`,
      `Jwts.parser().verifyWith(key).build().parseSignedClaims(token)`, Ktor's `jwt { verifier(...) }`).
    metadata:
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature", "CWE-287: Improper Authentication"]
      masvs: ["MASVS-AUTH-1"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: Algorithm.none()
      - pattern: $P.parseClaimsJwt(...)
      - pattern: $P.parseUnsecuredClaims(...)
      - pattern: $P.parseUnsecuredContent(...)
      - pattern: $B.unsecured()
      - patterns:
          - pattern: JWT.decode($T)
          - pattern-inside: |
              fun $F(...) { $...BODY }
          - metavariable-regex:
              metavariable: $...BODY
              regex: (?s)^(?!.*\.verify\().*$

  - id: gapscan.kotlin.jwt-hardcoded-secret
    languages: [kotlin]
    severity: ERROR
    message: >-
      The key that signs or checks JSON Web Tokens is a literal in the source. Anyone with the code (or a leaked build)
      can mint valid tokens for any user. Load the key from a secret store or environment at start-up, make it long and
      random, and rotate the one that was committed.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials", "CWE-321: Use of Hard-coded Cryptographic Key"]
      masvs: ["MASVS-AUTH-1"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: Algorithm.HMAC256("...")
      - pattern: Algorithm.HMAC384("...")
      - pattern: Algorithm.HMAC512("...")
      - pattern: Keys.hmacShaKeyFor("...".toByteArray(...))
      - pattern: Keys.hmacShaKeyFor("...".encodeToByteArray())
      - pattern: $B.signWith($ALG, "...")
      - pattern: $B.setSigningKey("...")
      - pattern: $B.setSigningKey("...".toByteArray(...))

  - id: gapscan.kotlin.cors-any-origin-with-credentials
    languages: [kotlin]
    severity: ERROR
    message: >-
      CORS allows every origin and also allows credentials (cookies, Authorization headers). Any web site the user
      visits can then call your API as that user and read the answers. List the exact origins that may call the API
      (`allowHost("app.example.com", schemes = listOf("https"))`, `allowedOrigins("https://app.example.com")`), or turn
      credentials off. The rule reads the configuration block as text.
    metadata:
      cwe: ["CWE-942: Permissive Cross-domain Policy with Untrusted Domains", "CWE-346: Origin Validation Error"]
      masvs: ["MASVS-AUTH-1"]
      category: security
      confidence: HIGH
    pattern-either:
      # Ktor: install(CORS) { anyHost(); allowCredentials = true }
      - pattern-regex: '(?s)install\(\s*CORS\s*\)\s*\{(?=(?:(?!\n\}|install\()[\s\S])*?\banyHost\(\))(?:(?!\n\}|install\()[\s\S])*?allowCredentials\s*=\s*true'
      # Spring: a wildcard origin (pattern) with allowCredentials(true) / allowCredentials = true, in either order
      - pattern-regex: '(?s)(?:allowedOriginPatterns|addAllowedOriginPattern|allowedOrigins|addAllowedOrigin)\(\s*"\*"\s*\)[^;{}]{0,400}?(?:allowCredentials\(\s*true\s*\)|allowCredentials\s*=\s*true)'
      - pattern-regex: '(?s)(?:allowCredentials\(\s*true\s*\)|allowCredentials\s*=\s*true)[^;{}]{0,400}?(?:allowedOriginPatterns|addAllowedOriginPattern|allowedOrigins|addAllowedOrigin)\(\s*"\*"\s*\)'
      - pattern-regex: '@CrossOrigin\((?=[^)]*origins\s*=\s*\[\s*"\*"\s*\])(?=[^)]*allowCredentials\s*=\s*"true")[^)]*\)'

  - id: gapscan.kotlin.csrf-protection-disabled
    languages: [kotlin]
    severity: WARNING
    message: >-
      Spring Security's CSRF protection is switched off. If the app authenticates browsers with cookies (a session or a
      remember-me cookie), another site can make the user's browser submit state-changing requests. Keep CSRF on for
      cookie-based sessions; switching it off is only safe for stateless APIs that take tokens from a header.
    metadata:
      cwe: ["CWE-352: Cross-Site Request Forgery (CSRF)"]
      masvs: ["MASVS-AUTH-1"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: $H.csrf().disable()
      - pattern: csrf { disable() }
      - pattern: $H.csrf { $C -> $C.disable() }
      - pattern: $H.csrf { it.disable() }
      - pattern: $H.csrf(AbstractHttpConfigurer<$A, $B>::disable)
      - pattern-regex: '\.csrf\(\s*(?:AbstractHttpConfigurer|CsrfConfigurer)\S*::disable\s*\)'

  - id: gapscan.kotlin.cookie-insecure-flags
    languages: [kotlin]
    severity: WARNING
    message: >-
      A cookie is set with `Secure` or `HttpOnly` switched off. Without `Secure` it is also sent over plain HTTP, where
      it can be read on the network; without `HttpOnly` any script injected into the page can steal it. Set both on
      session and authentication cookies (and `SameSite=Lax` or `Strict`).
    metadata:
      cwe: ["CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute", "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"]
      masvs: ["MASVS-NETWORK-1"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: $C.secure = false
      - pattern: $C.isSecure = false
      - pattern: $C.httpOnly = false
      - pattern: $C.isHttpOnly = false
      - pattern: $C.setSecure(false)
      - pattern: $C.setHttpOnly(false)
      - pattern: $B.secure(false)
      - pattern: $B.httpOnly(false)
      - pattern: Cookie($N, $V, ..., secure = false, ...)
      - pattern: Cookie($N, $V, ..., httpOnly = false, ...)
