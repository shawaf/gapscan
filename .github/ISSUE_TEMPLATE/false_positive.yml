name: False positive or missed finding
description: GapScan flagged safe code, or missed a real problem.
labels: [accuracy]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Which one
      options:
        - False positive (flagged safe code)
        - False negative (missed a real problem)
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule or scanner
      description: The rule id (for example gapscan.python.sqli-string-built) or the scanner name.
  - type: textarea
    id: code
    attributes:
      label: The code
      description: The smallest snippet that shows it. Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: For a false positive, why the code is safe. For a miss, what the problem is (a CWE helps).
