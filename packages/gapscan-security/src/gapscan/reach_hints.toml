# Curated "which function is the vulnerable one" hints, keyed by CVE. Advisory data from the OSV
# database is used first (Go publishes affected symbols); this file fills the gaps for well-known
# advisories. Each entry is a judgment call: verify against the advisory before adding more.
# A call to any listed name in a file that imports the package marks the finding `reachable`.

[[hint]]
cve = "CVE-2021-23337"
package = "lodash"
ecosystem = "npm"
symbols = ["template"]

[[hint]]
cve = "CVE-2019-10744"
