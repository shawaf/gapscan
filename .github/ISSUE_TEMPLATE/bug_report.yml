name: Bug report
description: GapScan crashed, gave a wrong result, or a command did not do what the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please remove secrets, private URLs and proprietary code before
        posting. A security problem in GapScan itself belongs in a private report (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: GapScan version
      description: Output of `gapscan version`.
      placeholder: gapscan 1.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - pipx / pip (PyPI)
        - Docker image (ghcr.io/shawaf/gapscan)
        - GitHub Action
        - Desktop app
        - From source (git clone + make setup)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The command you ran and its output. `gapscan doctor` output helps too.
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: A small example that shows it (optional)
      description: A few lines of code, or a public repository and commit.
