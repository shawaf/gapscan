[project]
name = "gapscan-core"
version = "1.1.1"
description = "Core: the gap model and the interfaces every layer above uses (no I/O)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gapscan"]
