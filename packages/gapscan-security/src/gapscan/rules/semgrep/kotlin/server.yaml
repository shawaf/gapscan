              - pattern-either:
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) = $E
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) = $E
              - metavariable-regex:
                  metavariable: $A
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|MatrixVariable|RequestPart|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $P
          # servlet requests and WebFlux functional handlers
          - pattern: $R.getParameter(...)
          - pattern: $R.getParameterValues(...)
          - pattern: $R.parameterMap
          - pattern: $R.getHeader(...)
          - pattern: $R.queryString
          - pattern: $R.getQueryString()
          - pattern: $R.queryParam(...)
          - pattern: $R.pathVariable(...)
          - pattern: $R.queryParams()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: call.respondRedirect($X, ...)
              - pattern: $RES.sendRedirect($X)
              - pattern: RedirectView($X, ...)
              - pattern: ModelAndView("redirect:" + $X)
              - pattern: '"redirect:" + $X'
              - pattern: '"redirect:${$X}"'
              - pattern: $H.location(URI($X))
              - pattern: $H.location(URI.create($X))
              - pattern: $RES.setHeader("Location", $X)
              - pattern: $RES.addHeader("Location", $X)
              - pattern: call.response.header(HttpHeaders.Location, $X)
              - pattern: call.response.header("Location", $X)
          - focus-metavariable: $X

  - id: gapscan.kotlin.taint-xss
    languages: [kotlin]
    mode: taint
    severity: ERROR
    message: >-
      Request data is written into an HTML response without escaping. A value containing `<script>` runs in the
      victim's browser on your origin, with their session. Render through a template engine or kotlinx.html (which
      escape by default), escape with `StringEscapeUtils.escapeHtml4` / `HtmlUtils.htmlEscape`, and never put request
      data inside `unsafe { }`.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      masvs: ["MASVS-CODE-4"]
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          # Ktor: route parameters, query string, form and body, headers and cookies
          - pattern: call.parameters
          - pattern: call.request.queryParameters
          - pattern: call.request.rawQueryParameters
          - pattern: call.receiveParameters()
          - pattern: call.receiveText()
          - pattern: call.receive<$T>()
          - pattern: call.receive(...)
          - pattern: call.receiveMultipart()
          - pattern: call.request.header(...)
          - pattern: call.request.headers
          - pattern: call.request.cookies
          - pattern: call.request.uri
          # Spring MVC / WebFlux handler parameters and JAX-RS resource parameters
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) = $E
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) = $E
              - metavariable-regex:
                  metavariable: $A
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|MatrixVariable|RequestPart|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $P
          # servlet requests and WebFlux functional handlers
          - pattern: $R.getParameter(...)
          - pattern: $R.getParameterValues(...)
          - pattern: $R.parameterMap
          - pattern: $R.getHeader(...)
          - pattern: $R.queryString
          - pattern: $R.getQueryString()
          - pattern: $R.queryParam(...)
          - pattern: $R.pathVariable(...)
          - pattern: $R.queryParams()
    pattern-sanitizers:
      - pattern-either:
          - pattern: StringEscapeUtils.escapeHtml4($X)
          - pattern: HtmlUtils.htmlEscape($X, ...)
          - pattern: Encode.forHtml($X)
          - pattern: $X.escapeHTML()
          - pattern: $X.toInt()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: call.respondText($X, ContentType.Text.Html, ...)
              - pattern: call.respondText($X, ContentType.parse("text/html"), ...)
              - pattern: call.respondText($X, contentType = ContentType.Text.Html, ...)
              - pattern: call.respondText(contentType = ContentType.Text.Html, text = $X, ...)
              - pattern: unsafe { +$X }
              - pattern: unsafe { raw($X) }
              - pattern: $RES.writer.write($X)
              - pattern: $RES.writer.print($X)
              - pattern: $RES.writer.println($X)
              - pattern: $RES.getWriter().write($X)
              - pattern: $RES.getWriter().print($X)
              - pattern: $RES.getWriter().println($X)
              - pattern: $RB.contentType(MediaType.TEXT_HTML).body($X)
          - focus-metavariable: $X

  - id: gapscan.kotlin.taint-code-injection
    languages: [kotlin]
    mode: taint
    severity: ERROR
    message: >-
