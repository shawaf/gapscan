# GapScan GitHub Action: scan a pull request, upload the results to the Security tab, comment on
# the PR. A thin wrapper over the CLI (`gapscan ci run` / `ci comment`); the scan runs inside the
# public image (ghcr.io/shawaf/gapscan, every scanner and fresh vulnerability data included) with the
# network switched off.
#
# Usage (see docs/github-action.md):
#   - uses: actions/checkout@v4
#     with: { fetch-depth: 0 }        # the diff against the base branch needs history
#   - uses: shawaf/gapscan@v1
#     with:
#       base: ${{ github.base_ref }}
#
# `engine: path` uses a `gapscan` already on PATH instead (a self-hosted runner with the offline
# bundle, or one installed with `install:`). Values from the event reach the shell through env only,
# never interpolated into a script.
name: GapScan
description: Find, prove and prioritize security gaps against OWASP, in your pull requests.
branding:
  icon: shield
  color: blue
inputs:
  target:
    description: Directory to scan.
    default: "."
  base:
    description: Base git ref to diff against (e.g. the PR base branch); empty scans everything.
    default: ""
  comment:
    description: Post the findings as a pull-request comment.
    default: "true"
  upload-sarif:
    description: Upload SARIF to the GitHub Security tab (needs security-events:write).
    default: "true"
  sarif-category:
    description: Code-scanning category for the SARIF upload.
    default: gapscan
  github-token:
    description: Token used to post the PR comment.
    default: ${{ github.token }}
  engine:
    description: "How to run GapScan: docker (the public image, nothing to install) or path (a gapscan already on PATH)."
    default: docker
  image:
    description: Image to run with engine docker. Empty = ghcr.io/shawaf/gapscan at the version this action was referenced with (@v1 -> :1, @v1.1.0 -> :1.1.0, a branch or SHA -> :latest).
    default: ""
  install:
    description: With engine path, a shell command that installs gapscan before scanning (empty = already on PATH).
    default: ""
runs:
  using: composite
  steps:
    - name: Install gapscan
      if: inputs.engine == 'path' && inputs.install != ''
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
      run: eval "$INSTALL"
    - name: Prepare the GapScan image
      id: prep
      if: inputs.engine == 'docker'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -z "$IMAGE" ]; then
          tag=latest
          if [[ "$ACTION_REF" =~ ^v([0-9]+(\.[0-9]+){0,2})$ ]]; then tag="${BASH_REMATCH[1]}"; fi
          IMAGE="ghcr.io/shawaf/gapscan:$tag"
        fi
        echo "using $IMAGE"
        docker image inspect "$IMAGE" > /dev/null 2>&1 || docker pull --quiet "$IMAGE"
        bin="$RUNNER_TEMP/gapscan-bin"
        mkdir -p "$bin"
        cp "$ACTION_PATH/integrations/ci/gapscan-docker.sh" "$bin/gapscan"
        chmod +x "$bin/gapscan"
        echo "$bin" >> "$GITHUB_PATH"
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
    - name: Scan
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        BASE: ${{ inputs.base }}
        GAPSCAN_DOCKER_NETWORK: none  # the scan never needs the network
        GAPSCAN_IMAGE: ${{ steps.prep.outputs.image }}
      run: >
        gapscan ci run "$TARGET" ${BASE:+--base "origin/$BASE"}
        --comment gapscan-comment.md --out gapscan-findings.json --sarif gapscan.sarif
    - name: Upload SARIF to the Security tab
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@0fda7a646fd14a20daf520829ca1ae8847000819 # codeql-bundle-v2.27.3
      with:
        sarif_file: gapscan.sarif
        category: ${{ inputs.sarif-category }}
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event.pull_request.number != ''
      shell: bash
      env:
        GAPSCAN_SCM_TOKEN: ${{ inputs.github-token }}
        GAPSCAN_DOCKER_NETWORK: bridge  # posting the comment talks to the GitHub API
        GAPSCAN_IMAGE: ${{ steps.prep.outputs.image }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: >
        gapscan ci comment gapscan-comment.md --provider github
        --url "$API_URL" --repo "$REPO" --pr "$PR_NUMBER"
    - name: Save the findings as an artifact
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gapscan-findings
        path: gapscan-findings.json
