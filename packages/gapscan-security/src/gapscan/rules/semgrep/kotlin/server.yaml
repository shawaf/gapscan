# GapScan Rules: server-side Kotlin (Ktor, Spring MVC/WebFlux, JAX-RS, servlets). Licensed Apache-2.0.
# Every rule has a vulnerable and a safe case in tests/rules/kotlin/server.kt (run: make rules-test).
# MASVS is a mobile standard and has no server controls; every rule in this folder must carry one, so these rules
# use the closest honest control: MASVS-CODE-4 ("validates and sanitizes all untrusted inputs") for injection, and
# MASVS-AUTH-1 ("secure authentication and authorization protocols") for token checks, CORS and CSRF.
rules:
  - id: gapscan.kotlin.taint-sqli
    languages: [kotlin]
    mode: taint
    severity: ERROR
    message: >-
      Request data (a Ktor parameter or body, a Spring or JAX-RS handler parameter) is put into an SQL statement as
      text. An attacker can change the query to read or modify other rows, or the whole database. Use bound parameters:
      `prepareStatement("... where id = ?")` with `setString`, JdbcTemplate's `?` arguments, `:name` parameters in JPA, or
      Exposed's DSL instead of `exec("...$value")`.
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      masvs: ["MASVS-CODE-4"]
      category: security
      confidence: HIGH
    pattern-sources:
      - pattern-either:
          # Ktor: route parameters, query string, form and body, headers and cookies
          - pattern: call.parameters
          - pattern: call.request.queryParameters
          - pattern: call.request.rawQueryParameters
          - pattern: call.receiveParameters()
          - pattern: call.receiveText()
          - pattern: call.receive<$T>()
          - pattern: call.receive(...)
          - pattern: call.receiveMultipart()
          - pattern: call.request.header(...)
          - pattern: call.request.headers
          - pattern: call.request.cookies
          - pattern: call.request.uri
          # Spring MVC / WebFlux handler parameters and JAX-RS resource parameters
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) = $E
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) = $E
              - metavariable-regex:
                  metavariable: $A
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|MatrixVariable|RequestPart|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $P
          # servlet requests and WebFlux functional handlers
          - pattern: $R.getParameter(...)
          - pattern: $R.getParameterValues(...)
          - pattern: $R.parameterMap
          - pattern: $R.getHeader(...)
          - pattern: $R.queryString
          - pattern: $R.getQueryString()
          - pattern: $R.queryParam(...)
          - pattern: $R.pathVariable(...)
          - pattern: $R.queryParams()
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.toInt()
          - pattern: $X.toLong()
          - pattern: $X.toIntOrNull()
          - pattern: $X.toLongOrNull()
          - pattern: $X.toBoolean()
          - pattern: UUID.fromString($X)
          - pattern: $X.toInt(...)
          - pattern: $X.toLong(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $S.executeQuery($X, ...)
              - pattern: $S.executeUpdate($X, ...)
              - pattern: $S.executeLargeUpdate($X, ...)
              - pattern: $S.execute($X, ...)
              - pattern: $S.addBatch($X)
              - pattern: $C.prepareStatement($X, ...)
              - pattern: $C.prepareCall($X, ...)
              - pattern: $C.nativeSQL($X)
              - pattern: $J.queryForObject($X, ...)
              - pattern: $J.queryForList($X, ...)
              - pattern: $J.queryForMap($X, ...)
              - pattern: $J.queryForRowSet($X, ...)
              - pattern: $J.query($X, ...)
              - pattern: $J.update($X, ...)
              - pattern: $J.batchUpdate($X, ...)
              - pattern: $EM.createQuery($X, ...)
              - pattern: $EM.createNativeQuery($X, ...)
              - pattern: exec($X, ...)
              - patterns:
                  # Exposed: TransactionManager.current().exec(sql), tx.exec(sql); not Runtime.exec (a command)
                  - pattern: $TX.exec($X, ...)
                  - metavariable-regex:
                      metavariable: $TX
                      regex: (?i)^(?!.*runtime).*(transaction|tx|current\(\)).*$
              - pattern: $D.fetch($X, ...)
              - pattern: $D.resultQuery($X, ...)
              - pattern: DSL.condition($X, ...)
              - pattern: $DB.rawQuery($X, ...)
              - pattern: $DB.execSQL($X, ...)
          - focus-metavariable: $X

  - id: gapscan.kotlin.taint-command-injection
    languages: [kotlin]
    mode: taint
    severity: ERROR
    message: >-
      Request data reaches a command the server runs. With a shell (`sh -c`) or a single command string an attacker
      can append their own commands; even as a separate argument it can add options. Run a fixed program with a fixed
      argument list, check the value against an allow-list, and never pass it through a shell.
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      masvs: ["MASVS-CODE-4"]
      category: security
      confidence: HIGH
    pattern-sources:
      - pattern-either:
          # Ktor: route parameters, query string, form and body, headers and cookies
          - pattern: call.parameters
          - pattern: call.request.queryParameters
          - pattern: call.request.rawQueryParameters
          - pattern: call.receiveParameters()
          - pattern: call.receiveText()
          - pattern: call.receive<$T>()
          - pattern: call.receive(...)
          - pattern: call.receiveMultipart()
          - pattern: call.request.header(...)
          - pattern: call.request.headers
          - pattern: call.request.cookies
          - pattern: call.request.uri
          # Spring MVC / WebFlux handler parameters and JAX-RS resource parameters
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) = $E
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) = $E
              - metavariable-regex:
                  metavariable: $A
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|MatrixVariable|RequestPart|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $P
          # servlet requests and WebFlux functional handlers
          - pattern: $R.getParameter(...)
          - pattern: $R.getParameterValues(...)
          - pattern: $R.parameterMap
          - pattern: $R.getHeader(...)
          - pattern: $R.queryString
          - pattern: $R.getQueryString()
          - pattern: $R.queryParam(...)
          - pattern: $R.pathVariable(...)
          - pattern: $R.queryParams()
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.toInt()
          - pattern: $X.toLong()
          - pattern: $X.toIntOrNull()
          - pattern: $X.toLongOrNull()
          - pattern: $X.toBoolean()
          - pattern: UUID.fromString($X)
          - pattern: $X.toInt(...)
          - pattern: $X.toLong(...)
    pattern-sinks:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec(...)
          - patterns:
              - pattern: $R.exec(...)
              - metavariable-regex:
                  metavariable: $R
                  regex: (?i)^.*runtime.*$
          - pattern: ProcessBuilder(...)
          - pattern: $PB.command(...)

  - id: gapscan.kotlin.taint-path-traversal
    languages: [kotlin]
    mode: taint
    severity: ERROR
    message: >-
      Request data is used as (part of) a file path. A value such as `../../etc/passwd` reads or overwrites files
      outside the folder you meant. Keep only the base name (`File(name).name`), or map the value to a known file, then
      check that `file.canonicalPath` starts with the base folder's canonical path.
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      masvs: ["MASVS-CODE-4"]
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          # Ktor: route parameters, query string, form and body, headers and cookies
          - pattern: call.parameters
          - pattern: call.request.queryParameters
          - pattern: call.request.rawQueryParameters
          - pattern: call.receiveParameters()
          - pattern: call.receiveText()
          - pattern: call.receive<$T>()
          - pattern: call.receive(...)
          - pattern: call.receiveMultipart()
          - pattern: call.request.header(...)
          - pattern: call.request.headers
          - pattern: call.request.cookies
          - pattern: call.request.uri
          # Spring MVC / WebFlux handler parameters and JAX-RS resource parameters
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) = $E
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) = $E
              - metavariable-regex:
                  metavariable: $A
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|MatrixVariable|RequestPart|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $P
          # servlet requests and WebFlux functional handlers
          - pattern: $R.getParameter(...)
          - pattern: $R.getParameterValues(...)
          - pattern: $R.parameterMap
          - pattern: $R.getHeader(...)
          - pattern: $R.queryString
          - pattern: $R.getQueryString()
          - pattern: $R.queryParam(...)
          - pattern: $R.pathVariable(...)
          - pattern: $R.queryParams()
    pattern-sanitizers:
      - pattern-either:
          - pattern: File($X).name
          - pattern: $X.substringAfterLast(...)
          - pattern: FilenameUtils.getName($X)
          - pattern: $X.toInt()
          - pattern: $X.toLong()
          - pattern: UUID.fromString($X)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: File($X)
              - pattern: File($D, $X)
              - pattern: Paths.get($X, ...)
              - pattern: Paths.get($D, $X, ...)
              - pattern: Path.of($X, ...)
              - pattern: Path.of($D, $X, ...)
              - pattern: $P.resolve($X)
              - pattern: FileInputStream($X)
              - pattern: FileOutputStream($X, ...)
              - pattern: FileReader($X)
              - pattern: FileWriter($X, ...)
              - pattern: call.respondFile($X)
              - pattern: call.respondFile($D, $X, ...)
              - pattern: FileSystemResource($X)
              - pattern: ClassPathResource($X, ...)
          - focus-metavariable: $X

  - id: gapscan.kotlin.taint-ssrf
    languages: [kotlin]
    mode: taint
    severity: ERROR
    message: >-
      Request data decides the address the server connects to. An attacker can make the server call internal
      services, cloud metadata endpoints (169.254.169.254) or other hosts with its own network position and
      credentials. Choose the host from an allow-list (compare the parsed host exactly), and only let the request pick a
      path or an id.
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      masvs: ["MASVS-CODE-4"]
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          # Ktor: route parameters, query string, form and body, headers and cookies
          - pattern: call.parameters
          - pattern: call.request.queryParameters
          - pattern: call.request.rawQueryParameters
          - pattern: call.receiveParameters()
          - pattern: call.receiveText()
          - pattern: call.receive<$T>()
          - pattern: call.receive(...)
          - pattern: call.receiveMultipart()
          - pattern: call.request.header(...)
          - pattern: call.request.headers
          - pattern: call.request.cookies
          - pattern: call.request.uri
          # Spring MVC / WebFlux handler parameters and JAX-RS resource parameters
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      fun $F(..., @$A $P: $T, ...) = $E
                  - pattern-inside: |
                      fun $F(..., @$A(...) $P: $T, ...) = $E
              - metavariable-regex:
                  metavariable: $A
                  regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue|ModelAttribute|MatrixVariable|RequestPart|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$
              - pattern: $P
          # servlet requests and WebFlux functional handlers
          - pattern: $R.getParameter(...)
          - pattern: $R.getParameterValues(...)
          - pattern: $R.parameterMap
          - pattern: $R.getHeader(...)
          - pattern: $R.queryString
          - pattern: $R.getQueryString()
          - pattern: $R.queryParam(...)
          - pattern: $R.pathVariable(...)
          - pattern: $R.queryParams()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: URL($X)
              - pattern: URL($X).$M(...)
              - pattern: $CL.get($X, ...)
              - pattern: $CL.post($X, ...)
              - pattern: $CL.put($X, ...)
              - pattern: $CL.delete($X, ...)
              - pattern: $CL.request($X, ...)
              - pattern: $CL.head($X, ...)
              - pattern: $CL.prepareGet($X, ...)
              - pattern: HttpRequest.newBuilder($X)
              - pattern: $B.uri($X)
              - pattern: $B.url($X)
              - pattern: $RT.getForObject($X, ...)
              - pattern: $RT.getForEntity($X, ...)
              - pattern: $RT.postForObject($X, ...)
              - pattern: $RT.postForEntity($X, ...)
              - pattern: $RT.exchange($X, ...)
              - pattern: WebClient.create($X)
              - pattern: $B.baseUrl($X)
          - focus-metavariable: $X

  - id: gapscan.kotlin.taint-open-redirect
    languages: [kotlin]
    mode: taint
    severity: WARNING
    message: >-
      Request data decides where the user is redirected. An attacker can send a link on your domain that lands on
      their phishing page (or leaks tokens in the URL). Redirect only to relative paths you recognise, or to hosts on an
      allow-list.
    metadata:
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      masvs: ["MASVS-CODE-4"]
