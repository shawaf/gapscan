# Publishes a GitHub release, either when a version tag (v1.2.3) is pushed or when the workflow is
# started by hand with a version (it then tags the commit it runs on). The notes are that version's
# section of CHANGELOG.md, so the changelog stays the one place release notes are written.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in CHANGELOG.md (for example 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract the notes for this version
        run: |
          version="${VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a version: $VERSION" >&2
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "GapScan $TAG" --notes-file notes.md
