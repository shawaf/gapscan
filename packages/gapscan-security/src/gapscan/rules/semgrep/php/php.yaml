# GapScan Rules: PHP (plain PHP, Laravel, Symfony; mysqli, PDO, Eloquent / query builder).
# Licensed Apache-2.0 with the rest of GapScan. Every rule has a vulnerable and a safe case in
# tests/rules/php/ (run: make rules-test). Taint rules follow untrusted data within one function.

x-request-sources: &request-sources
  - pattern-either:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $_FILES
      - pattern: $_SERVER['QUERY_STRING']
      - pattern: $_SERVER['REQUEST_URI']
      - pattern: $_SERVER['PHP_SELF']
      - pattern: $_SERVER['PATH_INFO']
      - pattern: $_SERVER['HTTP_REFERER']
      - pattern: $_SERVER['HTTP_USER_AGENT']
      - pattern: $_SERVER['HTTP_HOST']
      - pattern: $_SERVER['HTTP_X_FORWARDED_FOR']
      - pattern: getallheaders()
      - pattern: file_get_contents('php://input')
      - pattern: file_get_contents("php://input")
      - pattern: getenv(...)
      - pattern: $argv
      # Laravel / Symfony request objects
      - patterns:
          - pattern-either:
              - pattern: $REQ->input(...)
              - pattern: $REQ->get(...)
              - pattern: $REQ->query(...)
              - pattern: $REQ->post(...)
              - pattern: $REQ->all(...)
              - pattern: $REQ->only(...)
              - pattern: $REQ->except(...)
              - pattern: $REQ->header(...)
              - pattern: $REQ->cookie(...)
              - pattern: $REQ->route(...)
              - pattern: $REQ->json(...)
              - pattern: $REQ->getContent(...)
              - pattern: $REQ->string(...)
              - pattern: $REQ->str(...)
              - pattern: $REQ->query->get(...)
              - pattern: $REQ->request->get(...)
              - pattern: $REQ->headers->get(...)
              - pattern: $REQ->cookies->get(...)
              - pattern: $REQ->attributes->get(...)
              - pattern: $REQ->files->get(...)
              - pattern: $REQ->$PROP
          - metavariable-regex:
              metavariable: $REQ
              regex: ^\$(?:request|req|httpRequest)$
      - pattern: request(...)
      - pattern: request()->$M(...)
      - pattern: Request::$M(...)
      - pattern: Input::get(...)
      - pattern: Input::all(...)
      # Laravel / Symfony controller action parameters (route parameters): untyped or string ones;
      # typed numbers and framework objects (Request, models) cannot carry a payload themselves
      - patterns:
          - pattern-inside: |
              class $CLS extends $BASE { ... }
          - metavariable-regex:
              metavariable: $BASE
              regex: ^(?:.*\\)?(?:Controller|AbstractController|BaseController)$
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      public function $ACTION(..., $PARAM, ...) { ... }
                  - pattern-not-inside: |
                      public function $ACTION(..., $T $PARAM, ...) { ... }
              - pattern-inside: |
                  public function $ACTION(..., string $PARAM, ...) { ... }
          - metavariable-regex:
              metavariable: $ACTION
              regex: ^(?!__construct$)
          - focus-metavariable: $PARAM

x-propagators: &propagators
  - pattern: $A[] = $X
    from: $X
    to: $A
  - pattern: array_push($A, $X)
    from: $X
    to: $A
  - pattern: extract($X)
    from: $X
    to: $X

x-number-sanitizers: &number-sanitizers
  - pattern-either:
      - pattern: intval(...)
      - pattern: floatval(...)
      - pattern: boolval(...)
      - pattern: (int) $X
      - pattern: (integer) $X
      - pattern: (float) $X
      - pattern: (double) $X
      - pattern: (bool) $X
      - pattern: abs(...)
      - pattern: count(...)
      - pattern: strlen(...)
      - pattern: md5(...)
      - pattern: sha1(...)
      - pattern: hash(...)
      - pattern: uniqid(...)
      - pattern: filter_var($X, FILTER_VALIDATE_INT, ...)
      - pattern: filter_var($X, FILTER_VALIDATE_FLOAT, ...)
      - pattern: filter_var($X, FILTER_VALIDATE_BOOLEAN, ...)
      - pattern: filter_var($X, FILTER_SANITIZE_NUMBER_INT, ...)
      - pattern: filter_var($X, FILTER_SANITIZE_NUMBER_FLOAT, ...)
      - pattern: filter_input($T, $N, FILTER_VALIDATE_INT, ...)
      - pattern: filter_input($T, $N, FILTER_SANITIZE_NUMBER_INT, ...)
      # sprintf only makes values safe when every placeholder is numeric (%d %u %f ...), never with %s
      - patterns:
          - pattern: sprintf("$FMT", ...)
          - metavariable-regex:
              metavariable: $FMT
              regex: ^(?:[^%]|%%)*(?:%[-+ 0#']*\d*(?:\.\d+)?[dufFeEgGxXob](?:[^%]|%%)*)+$
      # arithmetic always yields a number
      - pattern: $A + $B
      - pattern: $A - $B
      - pattern: $A * $B
      - pattern: $A / $B
      - pattern: $A % $B
      # characters outside an allowlist removed: preg_replace('/[^a-z0-9]/i', '', $v), '/\W/'
      - patterns:
          - pattern: preg_replace("$RE", "", ...)
          - metavariable-regex:
              metavariable: $RE
              regex: .*(?:\[\^|\\W|\\D)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if (<... is_numeric($X) ...>) { ... }
              - pattern-inside: |
                  if (<... ctype_digit($X) ...>) { ... }
              - pattern-inside: |
                  if (<... filter_var($X, FILTER_VALIDATE_INT, ...) ...>) { ... }
              - pattern-inside: |
                  if (<... filter_var($X, FILTER_VALIDATE_FLOAT, ...) ...>) { ... }
              - patterns:
                  # an anchored allowlist pattern (^...$), not a search for a substring
                  - pattern-inside: |
                      if (<... preg_match("$RE", $X) ...>) { ... }
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^(.)\^.*\$\1[a-zA-Z]*$
          - pattern: $X

rules:
  # ----------------------------------------------------------------------------- injection (taint)
  - id: gapscan.php.taint-sqli
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted data reaches an SQL statement built from a string (SQL injection). Use prepared statements
      with bound values (`$pdo->prepare("... WHERE id = ?")->execute([$id])`, Eloquent / query builder
      bindings, `DB::select("... = ?", [$id])`) instead of concatenation.
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      category: security
      confidence: HIGH
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - pattern-either:
          - pattern: mysqli_real_escape_string(...)
          - pattern: mysql_real_escape_string(...)
          - pattern: $DB->real_escape_string(...)
          - pattern: $PDO->quote(...)
          - pattern: pg_escape_string(...)
          - pattern: pg_escape_literal(...)
          - pattern: SQLite3::escapeString(...)
          - pattern: $DB->escape(...)
      - pattern-either: *number-sanitizers
      - patterns:
          - pattern: settype($X, "$TYPE")
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?:int|integer|float|double|bool|boolean)$
          - focus-metavariable: $X
        by-side-effect: true
    pattern-sinks:
      - patterns:
          - pattern: $QB->$RAW($Q, ...)
          - metavariable-regex:
              metavariable: $RAW
              regex: ^(?:whereRaw|orWhereRaw|selectRaw|orderByRaw|havingRaw|orHavingRaw|groupByRaw|fromRaw)$
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: mysqli_query($C, $Q, ...)
              - pattern: mysqli_multi_query($C, $Q)
              - pattern: mysqli_prepare($C, $Q)
              - pattern: mysqli_real_query($C, $Q)
              - pattern: mysql_query($Q, ...)
              - pattern: mysql_unbuffered_query($Q, ...)
              - pattern: pg_query($C, $Q)
              - pattern: pg_query($Q)
              - pattern: pg_send_query($C, $Q)
              - pattern: pg_prepare($C, $N, $Q)
              - pattern: sqlsrv_query($C, $Q, ...)
              - pattern: odbc_exec($C, $Q, ...)
              - pattern: odbc_prepare($C, $Q)
              - pattern: sqlite_query($C, $Q, ...)
              - pattern: mssql_query($Q, ...)
              - pattern: DB::select($Q, ...)
              - pattern: DB::statement($Q, ...)
              - pattern: DB::unprepared($Q)
              - pattern: DB::raw($Q)
              - pattern: DB::insert($Q, ...)
              - pattern: DB::update($Q, ...)
              - pattern: DB::delete($Q, ...)
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: $DB->query($Q, ...)
              - pattern: $DB->exec($Q)
              - pattern: $DB->prepare($Q, ...)
              - pattern: $DB->multi_query($Q)
              - pattern: $DB->real_query($Q)
              - pattern: $DB->get_results($Q, ...)
              - pattern: $DB->get_row($Q, ...)
              - pattern: $DB->get_var($Q, ...)
              - pattern: $DB->get_col($Q, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)^(?:\$this->)?\$?_?(?:db|conn|mysql|pdo|sql|link|database|connection|dbh|wpdb|mysqli|pg|con|cnx)\w*$
          - focus-metavariable: $Q

  - id: gapscan.php.taint-command-injection
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted data reaches a shell command (OS command injection). Avoid the shell; if you must, pass
      each value through `escapeshellarg()` and validate it against a strict pattern first.
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      category: security
      confidence: HIGH
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - pattern-either:
          - pattern: escapeshellarg(...)
          - pattern: escapeshellcmd(...)
      - pattern-either: *number-sanitizers
      - patterns:
          - pattern: settype($X, "$TYPE")
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?:int|integer|float|double|bool|boolean)$
          - focus-metavariable: $X
        by-side-effect: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($X, ...)
              - pattern: shell_exec($X)
              - pattern: system($X, ...)
              - pattern: passthru($X, ...)
              - pattern: popen($X, $M)
              - pattern: proc_open($X, ...)
              - pattern: pcntl_exec($X, ...)
              - pattern: Process::fromShellCommandline($X, ...)
              - pattern: new Process($X, ...)
          - focus-metavariable: $X

  - id: gapscan.php.taint-file-inclusion
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted data chooses a file to include (local / remote file inclusion: reads files, or runs code
      with `php://input` or an uploaded file). Map the input to a fixed list of files instead.
    metadata:
      cwe: ["CWE-98: Improper Control of Filename for Include/Require Statement in PHP Program"]
      category: security
      confidence: HIGH
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - pattern-either: *number-sanitizers
      - patterns:
          - pattern: settype($X, "$TYPE")
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?:int|integer|float|double|bool|boolean)$
          - focus-metavariable: $X
        by-side-effect: true
      - patterns:
          - pattern-inside: |
              if (<... in_array($X, $ALLOWED, ...) ...>) { ... }
          - pattern: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: include $X;
              - pattern: include_once $X;
              - pattern: require $X;
              - pattern: require_once $X;
              - pattern: include($X);
              - pattern: include_once($X);
              - pattern: require($X);
              - pattern: require_once($X);
          - focus-metavariable: $X

  - id: gapscan.php.taint-path-traversal
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted data is used as a file path (path traversal: `../` reaches other files). Keep only the
      name with `basename()`, join it to a fixed folder and check `realpath()` stays inside it.
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      category: security
      confidence: HIGH
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - pattern-either:
          - pattern: basename(...)
      - pattern-either: *number-sanitizers
      - patterns:
          - pattern: settype($X, "$TYPE")
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?:int|integer|float|double|bool|boolean)$
          - focus-metavariable: $X
        by-side-effect: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: file_get_contents($P, ...)
              - pattern: file_put_contents($P, ...)
              - pattern: fopen($P, ...)
              - pattern: file($P, ...)
              - pattern: readfile($P, ...)
              - pattern: unlink($P, ...)
              - pattern: copy($P, ...)
              - pattern: copy($S, $P, ...)
              - pattern: rename($P, ...)
              - pattern: rename($S, $P, ...)
              - pattern: rmdir($P, ...)
              - pattern: mkdir($P, ...)
              - pattern: opendir($P, ...)
              - pattern: scandir($P, ...)
              - pattern: is_file($P)
              - pattern: file_exists($P)
              - pattern: parse_ini_file($P, ...)
              - pattern: highlight_file($P, ...)
              - pattern: show_source($P, ...)
              - pattern: simplexml_load_file($P, ...)
              - pattern: move_uploaded_file($S, $P)
              - pattern: Storage::get($P)
              - pattern: Storage::download($P, ...)
              - pattern: Storage::delete($P)
              - pattern: Storage::put($P, ...)
              - pattern: response()->download($P, ...)
              - pattern: response()->file($P, ...)
              - pattern: new BinaryFileResponse($P, ...)
              - pattern: new SplFileObject($P, ...)
          - pattern-not: file_get_contents("php://input")
          - pattern-not: file_get_contents('php://input')
          - focus-metavariable: $P

  - id: gapscan.php.taint-ssrf
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted data chooses the URL of a server-side request (SSRF: internal services and cloud metadata
      become reachable). Allow only known hosts and the http(s) scheme before making the request.
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      category: security
      confidence: MEDIUM
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: curl_init($U)
              - pattern: curl_setopt($CH, CURLOPT_URL, $U)
              - pattern: Http::get($U, ...)
              - pattern: Http::post($U, ...)
              - pattern: Http::put($U, ...)
              - pattern: Http::delete($U, ...)
              - pattern: Http::$W(...)->get($U, ...)
              - pattern: Http::$W(...)->post($U, ...)
              - pattern: $CLIENT->request($M, $U, ...)
              - pattern: get_headers($U, ...)
          - focus-metavariable: $U

  - id: gapscan.php.taint-xss
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted data is written into the page without HTML encoding (cross-site scripting). Encode it with
      `htmlspecialchars($v, ENT_QUOTES, 'UTF-8')` (Laravel: `{{ $v }}` / `e($v)`), and never place it in
      a script or an event handler.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      category: security
      confidence: HIGH
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - pattern-either:
          - pattern: htmlspecialchars(...)
          - pattern: htmlentities(...)
          - pattern: e(...)
          - pattern: strip_tags(...)
          - pattern: urlencode(...)
          - pattern: rawurlencode(...)
          - pattern: json_encode(...)
          - pattern: http_build_query(...)
          - pattern: filter_var($X, FILTER_SANITIZE_SPECIAL_CHARS, ...)
          - pattern: filter_var($X, FILTER_SANITIZE_FULL_SPECIAL_CHARS, ...)
          - pattern: filter_var($X, FILTER_VALIDATE_EMAIL, ...)
          - pattern: filter_var($X, FILTER_VALIDATE_URL, ...)
          - pattern: $PURIFIER->purify(...)
      - pattern-either: *number-sanitizers
      - patterns:
          - pattern: settype($X, "$TYPE")
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?:int|integer|float|double|bool|boolean)$
          - focus-metavariable: $X
        by-side-effect: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: echo $X;
              - pattern: echo $X, ...;
              - pattern: print $X;
              - pattern: print($X);
              - pattern: printf($X, ...)
              - pattern: printf($F, ..., $X, ...)
              - pattern: vprintf($F, $X)
              - pattern: print_r($X)
              - pattern: response($X, ...)
              - pattern: new Response($X, ...)
              - pattern: Response::make($X, ...)
              - pattern: die($X)
              - pattern: exit($X)
          - focus-metavariable: $X

  - id: gapscan.php.taint-open-redirect
    languages: [php]
    mode: taint
    severity: WARNING
    message: >-
      Untrusted data chooses where the user is redirected (open redirect, used in phishing). Redirect only
      to paths of this site, or to entries of a fixed allowlist.
    metadata:
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      category: security
      confidence: HIGH
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - pattern-either:
          - pattern: urlencode(...)
          - pattern: rawurlencode(...)
          - pattern: http_build_query(...)
      - pattern-either: *number-sanitizers
      - patterns:
          - pattern: settype($X, "$TYPE")
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?:int|integer|float|double|bool|boolean)$
          - focus-metavariable: $X
        by-side-effect: true
      - patterns:
          - pattern-inside: |
              if (<... in_array($X, $ALLOWED, ...) ...>) { ... }
          - pattern: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: header($H, ...)
          - metavariable-pattern:
              metavariable: $H
              patterns:
                - pattern-regex: (?i)location
          - focus-metavariable: $H
      - patterns:
          - pattern-either:
              - pattern: redirect($U, ...)
              - pattern: redirect()->to($U, ...)
              - pattern: redirect()->away($U, ...)
              - pattern: Redirect::to($U, ...)
              - pattern: Redirect::away($U, ...)
              - pattern: new RedirectResponse($U, ...)
              - pattern: $this->redirect($U, ...)
          - focus-metavariable: $U

  - id: gapscan.php.taint-ldap-injection
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted data is placed in an LDAP filter or DN (LDAP injection). Escape it with
      `ldap_escape($v, '', LDAP_ESCAPE_FILTER)` (or `LDAP_ESCAPE_DN` for a DN).
    metadata:
      cwe: ["CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"]
      category: security
      confidence: HIGH
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - pattern-either:
          - pattern: ldap_escape(...)
      - pattern-either: *number-sanitizers
      - patterns:
          - pattern: settype($X, "$TYPE")
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?:int|integer|float|double|bool|boolean)$
          - focus-metavariable: $X
        by-side-effect: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: ldap_search($C, $BASE, $F, ...)
              - pattern: ldap_list($C, $BASE, $F, ...)
              - pattern: ldap_read($C, $BASE, $F, ...)
          - focus-metavariable: $F
      - patterns:
          - pattern-either:
              - pattern: ldap_search($C, $F, ...)
              - pattern: ldap_list($C, $F, ...)
              - pattern: ldap_read($C, $F, ...)
              - pattern: ldap_bind($C, $F, ...)
          - focus-metavariable: $F

  - id: gapscan.php.taint-xpath-injection
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted data is placed in an XPath expression (XPath injection). Validate the value against a
      strict pattern, or escape quotes by building the literal with `concat()`.
    metadata:
      cwe: ["CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"]
      category: security
      confidence: HIGH
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - pattern-either: *number-sanitizers
      - patterns:
          - pattern: settype($X, "$TYPE")
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?:int|integer|float|double|bool|boolean)$
          - focus-metavariable: $X
        by-side-effect: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $XP->query($X, ...)
              - pattern: $XP->evaluate($X, ...)
              - pattern: $XML->xpath($X)
          - metavariable-regex:
              metavariable: $XP
              regex: (?i).*(?:xpath|xp|dom|nav)
          - focus-metavariable: $X
      - patterns:
          - pattern: $XML->xpath($X)
          - focus-metavariable: $X

  - id: gapscan.php.taint-code-injection
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted data is run as PHP code or chooses which function runs (code injection). Never evaluate
      input; map it to a fixed set of operations.
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      category: security
      confidence: HIGH
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sanitizers:
      - pattern-either: *number-sanitizers
      - patterns:
          - pattern: settype($X, "$TYPE")
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?:int|integer|float|double|bool|boolean)$
          - focus-metavariable: $X
        by-side-effect: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X)
              - pattern: assert($X, ...)
              - pattern: create_function($A, $X)
              - pattern: call_user_func($X, ...)
              - pattern: call_user_func_array($X, ...)
              - pattern: preg_replace_callback($P, $X, ...)
              - pattern: array_map($X, ...)
              - pattern: usort($A, $X)
          - focus-metavariable: $X

  - id: gapscan.php.taint-deserialization
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted data is unserialized (PHP object injection: magic methods of existing classes run with
      attacker-chosen properties). Use `json_decode`, or `unserialize($v, ['allowed_classes' => false])`.
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      category: security
      confidence: HIGH
    pattern-sources: *request-sources
    pattern-propagators: *propagators
    pattern-sinks:
      - patterns:
          - pattern: unserialize($X, ...)
          - pattern-not: "unserialize($X, ['allowed_classes' => false])"
          - pattern-not: 'unserialize($X, ["allowed_classes" => false])'
          - focus-metavariable: $X

  - id: gapscan.php.taint-upload-name
    languages: [php]
    mode: taint
    severity: ERROR
    message: >-
      An uploaded file is stored under the name the client chose, so an attacker can upload `shell.php`
      into a served folder (unrestricted upload). Generate the stored name yourself, check the type, and
      keep uploads outside the web root.
    metadata:
      cwe: ["CWE-434: Unrestricted Upload of File with Dangerous Type"]
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          - pattern: $_FILES[$F]['name']
          - pattern: $FILE->getClientOriginalName()
          - pattern: $FILE->getClientOriginalExtension()
    pattern-sanitizers:
      - pattern-either:
          - pattern: md5(...)
          - pattern: sha1(...)
          - pattern: hash(...)
          - pattern: uniqid(...)
          - pattern: bin2hex(...)
          - pattern: Str::random(...)
      - patterns:
          - pattern-inside: |
              if (<... in_array($X, $ALLOWED, ...) ...>) { ... }
          - pattern: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: move_uploaded_file($TMP, $DEST)
              - pattern: $UP->move($DIR, $DEST)
              - pattern: $UP->storeAs($DIR, $DEST, ...)
          - focus-metavariable: $DEST

  # ----------------------------------------------------------------------------- unsafe APIs and settings
  - id: gapscan.php.sqli-string-built
    languages: [php]
    severity: WARNING
    message: >-
      A raw SQL fragment is built by concatenation or interpolation, so a value can change the statement.
      Pass values as bindings: `whereRaw('price > ?', [$min])`, `DB::select('... = ?', [$id])`.
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: DB::raw($Q)
          - pattern: DB::select($Q)
          - pattern: DB::statement($Q)
          - pattern: DB::unprepared($Q)
          - patterns:
              - pattern: $B->$RAW($Q)
              - metavariable-regex:
                  metavariable: $RAW
                  regex: ^(?:whereRaw|orWhereRaw|selectRaw|orderByRaw|havingRaw|groupByRaw)$
      - metavariable-regex:
          metavariable: $Q
          regex: (?s)^(?!.*(?:\(int\)|intval\()).*(?:\.\s*\$\w|\$\w+(?:\[[^\]]*\])?\s*\.|^"[^"]*\$\w)

  - id: gapscan.php.unserialize-without-allowed-classes
    languages: [php]
    severity: WARNING
    message: >-
      `unserialize()` without `['allowed_classes' => false]` can create any class, so data that is not
      fully trusted leads to PHP object injection. Prefer `json_decode`, or pass `allowed_classes`.
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      category: security
      confidence: LOW
    patterns:
      - pattern: unserialize($X)
      - pattern-not: unserialize("...")

  - id: gapscan.php.extract-request
    languages: [php]
    severity: ERROR
    message: >-
      `extract()` on request data lets a visitor overwrite any variable, including ones that control
      access. Read the fields you need explicitly.
    metadata:
      cwe: ["CWE-621: Variable Extraction Error"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: extract($_GET, ...)
      - pattern: extract($_POST, ...)
      - pattern: extract($_REQUEST, ...)
      - pattern: extract($_COOKIE, ...)
      - pattern: extract($_FILES, ...)
      - pattern: extract($REQ->all(), ...)
      - pattern: parse_str($S)

  - id: gapscan.php.weak-hash-for-password
    languages: [php]
    severity: ERROR
    message: >-
      MD5 / SHA-1 (or a single fast hash) is used for a password, which is cracked in seconds on a GPU.
      Use `password_hash($pw, PASSWORD_DEFAULT)` and `password_verify`.
    metadata:
      cwe: ["CWE-916: Use of Password Hash With Insufficient Computational Effort"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: md5($X)
          - pattern: sha1($X)
          - pattern: hash("md5", $X)
          - pattern: hash("sha1", $X)
          - pattern: hash("sha256", $X)
          - pattern: crypt($X)
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(?:pass|pwd|secret)

  - id: gapscan.php.weak-hash
    languages: [php]
    severity: INFO
    message: >-
      MD5 and SHA-1 are broken for security use (collisions). Fine for a cache key; for signatures or
      tokens use `hash('sha256', ...)` or `hash_hmac`, for passwords `password_hash`.
    metadata:
      cwe: ["CWE-328: Use of Weak Hash"]
      category: security
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: md5($X)
          - pattern: sha1($X)
          - pattern: hash("md5", $X)
          - pattern: hash("sha1", $X)
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(?!.*(?:pass|pwd|secret)).*$

  - id: gapscan.php.weak-random-for-secret
    languages: [php]
    severity: WARNING
    message: >-
      `rand()`, `mt_rand()`, `uniqid()` and `lcg_value()` are predictable; do not use them for tokens,
      passwords, keys or reset codes. Use `random_bytes()` / `random_int()` (Laravel: `Str::random`).
    metadata:
      cwe: ["CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $NAME = <... rand(...) ...>;
          - pattern: $NAME = <... mt_rand(...) ...>;
          - pattern: $NAME = <... uniqid(...) ...>;
          - pattern: $NAME = <... lcg_value(...) ...>;
          - pattern: $NAME = <... str_shuffle(...) ...>;
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(?:token|passw|secret|salt|nonce|otp|apikey|api_key|session|reset|verification|csrf|key$)

  - id: gapscan.php.hardcoded-secret
    languages: [php]
    severity: WARNING
    message: >-
      A password, key or token is written in the source code. Read it from the environment (`env()` in
      Laravel config files) or a secret store.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE";
          - pattern: define("$NAME", "$VALUE");
          - pattern: const $NAME = "$VALUE";
          - pattern: '["$NAME" => "$VALUE"]'
          - pattern: "['$NAME' => '$VALUE']"
          - pattern: '[..., "$NAME" => "$VALUE", ...]'
          - pattern: "[..., '$NAME' => '$VALUE', ...]"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(?:password|passwd|pwd|secret|api_?key|access_?key|private_?key|client_?secret|auth_?token|token)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!(?i:changeme|password|example|secret|xxx+|\*+|your[_-]|<|\{|\$|%|todo|placeholder|test|dummy|null)).{8,}$
      - focus-metavariable: $VALUE

  - id: gapscan.php.tls-verification-disabled
    languages: [php]
    severity: ERROR
    message: >-
      TLS certificate verification is turned off, so anyone on the network path can read and change the
      traffic. Keep verification on; for an internal CA, point `CURLOPT_CAINFO` / Guzzle `verify` at it.
    metadata:
      cwe: ["CWE-295: Improper Certificate Validation"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYPEER, false)
      - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYPEER, 0)
      - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYHOST, 0)
      - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYHOST, false)
      - pattern: "['verify' => false]"
      - pattern: "[..., 'verify' => false, ...]"
      - pattern: Http::withoutVerifying()
      - pattern: "['ssl' => ['verify_peer' => false, ...]]"
      - pattern: "[..., 'verify_peer' => false, ...]"

  - id: gapscan.php.cookie-without-flags
    languages: [php]
    severity: WARNING
    message: >-
      A cookie is set without the `secure` and `httponly` flags, so it can travel over plain HTTP or be
      read by scripts after an XSS. Pass the options array with `secure`, `httponly` and `samesite`.
    metadata:
      cwe: ["CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: setcookie($N, $V)
          - pattern: setcookie($N, $V, $E)
          - pattern: setcookie($N, $V, $E, $P)
          - pattern: setcookie($N, $V, $E, $P, $D)
          - pattern: setcookie($N, $V, $E, $P, $D, false, ...)
          - pattern: setcookie($N, $V, $E, $P, $D, $S, false)
          - pattern: "setcookie($N, $V, [..., 'httponly' => false, ...])"
          - pattern: "setcookie($N, $V, [..., 'secure' => false, ...])"
          - pattern: ini_set('session.cookie_httponly', 0)
          - pattern: ini_set('session.cookie_secure', 0)
      - pattern-not: setcookie($N, $V, [...])

  - id: gapscan.php.debug-mode-on
    languages: [php]
    severity: WARNING
    message: >-
      Debug output is on, so errors show stack traces, queries and configuration to visitors. Turn it off
      in production (`APP_DEBUG=false`, `display_errors=0`).
    metadata:
      cwe: ["CWE-489: Active Debug Code"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: "['debug' => true]"
      - pattern: "[..., 'debug' => true, ...]"
      - pattern: ini_set('display_errors', 1)
      - pattern: ini_set('display_errors', '1')
      - pattern: ini_set('display_errors', 'On')
      - pattern: ini_set('display_errors', true)
      - pattern: phpinfo()

  - id: gapscan.php.mass-assignment-unguarded
    languages: [php]
    severity: WARNING
    message: >-
      The model accepts every attribute from mass assignment (`$guarded = []`), so a request can set
      fields like `is_admin`. List the assignable fields in `$fillable` instead.
    metadata:
      cwe: ["CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: |
          class $C extends $BASE { ... protected $guarded = []; ... }
      - pattern: $MODEL::unguard()

  - id: gapscan.php.weak-cipher
    languages: [php]
    severity: ERROR
    message: >-
      DES, 3DES, RC4, Blowfish and ECB mode are broken or leak patterns. Use `openssl_encrypt` with
      `aes-256-gcm` (or libsodium's `sodium_crypto_secretbox`).
    metadata:
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: mcrypt_encrypt(...)
      - pattern: mcrypt_decrypt(...)
      - patterns:
          - pattern-either:
              - pattern: openssl_encrypt($D, "$ALG", ...)
              - pattern: openssl_decrypt($D, "$ALG", ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^(?:des|rc4|rc2|bf|blowfish|.*-ecb$)
