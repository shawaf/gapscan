repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1500]  # the built single-file dashboard template is ~700 KB
  - repo: local
    hooks:
      - id: import-boundaries
        name: import boundaries (ARCHITECTURE.md)
        entry: uv run lint-imports --no-logo
        language: system
        pass_filenames: false
        files: ^(packages/.*\.py|.*pyproject\.toml)$
