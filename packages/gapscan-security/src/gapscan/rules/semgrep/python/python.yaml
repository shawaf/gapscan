  # --- round 2: model and data loading, archives, comparisons, settings ----------------------------------
  - id: gapscan.python.unsafe-model-load
    languages: [python]
    severity: ERROR
    message: >-
      This loader unpickles its input, so a model, array or cache file from outside can run code when it is
      loaded (a downloaded checkpoint is enough). Load weights with `torch.load(..., weights_only=True)` or
      `safetensors`, keep `allow_pickle=False` for NumPy, and only open `joblib`/`dill`/`shelve`/`read_pickle`
      files that your own code wrote to storage nobody else can change.
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: torch.load(...)
          - pattern: numpy.load(..., allow_pickle=True, ...)
          - pattern: np.load(..., allow_pickle=True, ...)
          - pattern: joblib.load(...)
          - pattern: dill.load(...)
          - pattern: shelve.open(...)
          - pattern: pandas.read_pickle(...)
          - pattern: pd.read_pickle(...)
          - pattern: cloudpickle.load(...)
          - pattern: cloudpickle.loads(...)
          - pattern: jsonpickle.loads(...)
      - pattern-not: torch.load(..., weights_only=True, ...)

  - id: gapscan.python.tar-extract-unfiltered
    languages: [python]
    severity: ERROR
    message: >-
      A tar archive is extracted without a filter. Member names such as `../../etc/cron.d/x`, absolute paths and links
      are written as given, so an archive from outside can overwrite any file the process can write (tar slip).
      Pass `filter="data"` to `extractall`/`extract` (Python 3.12, backported to earlier security releases), or
      check that every member resolves inside the destination and is not a link before extracting it.
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $T.extractall(...)
          - pattern: $T.extract(...)
      - pattern-either:
          - pattern-inside: |
              with tarfile.open(...) as $T:
                  ...
          - pattern-inside: |
              $T = tarfile.open(...)
              ...
          - pattern-inside: |
              with tarfile.TarFile(...) as $T:
                  ...
          - pattern-inside: |
              $T = tarfile.TarFile(...)
              ...
      - pattern-not: $T.extractall(..., filter="data", ...)
      - pattern-not: $T.extractall(..., filter="tar", ...)
      - pattern-not: $T.extractall(..., filter=tarfile.data_filter, ...)
      - pattern-not: $T.extractall(..., filter=tarfile.tar_filter, ...)
      - pattern-not: $T.extract(..., filter="data", ...)
      - pattern-not: $T.extract(..., filter="tar", ...)
      - pattern-not: $T.extract(..., filter=tarfile.data_filter, ...)

  - id: gapscan.python.zip-extract-unchecked
    languages: [python]
    severity: WARNING
    message: >-
      A whole zip archive is extracted without looking at its members. Python's `zipfile` drops `..` and absolute
      parts from names, but an archive from outside can still overwrite files already in the destination and expand
      into gigabytes (zip bomb), and code that later copies or re-packs the files may not be as careful. Check that
      each member's resolved path stays inside the destination, and limit the member count and total uncompressed
      size before extracting.
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')", "CWE-409: Improper Handling of Highly Compressed Data (Data Amplification)"]
      category: security
      confidence: LOW
    patterns:
      - pattern: $Z.extractall(...)
      - pattern-either:
          - pattern-inside: |
              with zipfile.ZipFile(...) as $Z:
                  ...
          - pattern-inside: |
              $Z = zipfile.ZipFile(...)
              ...
      - pattern-not-inside: |
          for $M in $Z.$LIST(...):
              ...
          ...

  - id: gapscan.python.archive-member-path-joined
    languages: [python]
    severity: ERROR
    message: >-
      An archive member's own name is joined to the destination folder and written, so a member called
      `../../app/settings.py` lands outside it (zip slip). Resolve the joined path and check it is still inside the
      destination before writing, or let `zipfile.extract`/`tarfile.extract(filter="data")` do the extraction.
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: open(os.path.join($D, $M.$NAME), ...)
          - patterns:
              - pattern-inside: |
                  $P = os.path.join($D, $M.$NAME)
                  ...
              - pattern: open($P, ...)
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(filename|name)$
      - pattern-either:
          - pattern-inside: |
              for $M in $A.infolist():
                  ...
          - pattern-inside: |
              for $M in $A.getmembers():
                  ...
      - pattern-not-inside: |
          if not <... $X.startswith(...) ...>:
              ...
          ...
      - pattern-not-inside: |
          if <... os.path.commonpath(...) ...>:
              ...
          ...

  - id: gapscan.python.timing-unsafe-secret-compare
    languages: [python]
    severity: WARNING
    message: >-
      A signature, token or other secret is compared with `==`/`!=`, which stops at the first differing byte; the
      time it takes lets an attacker guess the expected value byte by byte. Compare secrets with
      `hmac.compare_digest(a, b)` (or `secrets.compare_digest`).
    metadata:
      cwe: ["CWE-208: Observable Timing Discrepancy"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-regex:
                  metavariable: $A
                  regex: (?i).*(signature|hmac|api_?key|secret|csrf_?token|auth_?token|access_?token|webhook_?token|otp_?code)
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-regex:
                  metavariable: $B
                  regex: (?i).*(signature|hmac|api_?key|secret|csrf_?token|auth_?token|access_?token|webhook_?token|otp_?code)
      # comparisons with literals, None, lengths and enum members (Category.SECRET) are not secret checks
      - metavariable-regex:
          metavariable: $A
          regex: ^(?!None$|True$|False$|-?\d+$|len\(|type\(|["']|([\w.]*\.)?[A-Z][a-z]\w*\.[A-Z][A-Z0-9_]+$)
      - metavariable-regex:
          metavariable: $B
          regex: ^(?!None$|True$|False$|-?\d+$|len\(|type\(|["']|([\w.]*\.)?[A-Z][a-z]\w*\.[A-Z][A-Z0-9_]+$)
      - pattern-not-inside: hmac.compare_digest(...)

  - id: gapscan.python.assert-used-for-authorization
    languages: [python]
    severity: WARNING
    message: >-
      An access check is written as `assert`. Python drops every `assert` when it runs with `-O`, so the check
      silently disappears and anyone gets through. Use an explicit `if not ...:` that raises a permission error or
      returns 403.
    metadata:
      cwe: ["CWE-285: Improper Authorization", "CWE-617: Reachable Assertion"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: assert $COND, ...
          - pattern: assert $COND
      - metavariable-regex:
          metavariable: $COND
          regex: (?i).*\b(is_authenticated|is_admin|is_staff|is_superuser|is_owner|has_perms?|has_permission|has_role|check_permission|can_(access|edit|view|delete|manage)|is_allowed|is_authorized|user_can|owner_id)\b

  - id: gapscan.python.allowed-hosts-wildcard
    languages: [python]
    severity: WARNING
    message: >-
      Django accepts any Host header, so password-reset links and absolute URLs can be built with an attacker's host
      (host header poisoning). List only your own domains in `ALLOWED_HOSTS` (read them from the environment per
      deployment).
    metadata:
      cwe: ["CWE-183: Permissive List of Allowed Inputs"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: ALLOWED_HOSTS = [..., "*", ...]
      - pattern: ALLOWED_HOSTS = (..., "*", ...)

  - id: gapscan.python.hardcoded-app-secret-key
    languages: [python]
    severity: ERROR
    message: >-
      The web framework's signing key is written into the code. Whoever reads the code can sign session cookies,
      password-reset tokens and CSRF tokens, so they can log in as any user. Read the key from the environment or a
      secret store and rotate the one in the code.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials", "CWE-321: Use of Hard-coded Cryptographic Key"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $APP.secret_key = "..."
          - pattern: $APP.config["SECRET_KEY"] = "..."
          - pattern: $APP.config["JWT_SECRET_KEY"] = "..."
          - pattern: $APP.config.update(..., SECRET_KEY="...", ...)
      - pattern-not: $APP.secret_key = ""
      - pattern-not: $APP.config["SECRET_KEY"] = ""

  - id: gapscan.python.xmlrpc-dotted-names
    languages: [python]
    severity: ERROR
    message: >-
      An XML-RPC server publishes an object with `allow_dotted_names=True`, which lets any client walk attributes to
      the object's module globals and call them (remote code execution). Remove the flag and register only the
      functions clients need with `register_function`.
    metadata:
      cwe: ["CWE-749: Exposed Dangerous Method or Function"]
      category: security
      confidence: HIGH
    pattern: $S.register_instance(..., allow_dotted_names=True, ...)

  - id: gapscan.python.taint-regex-injection
    languages: [python]
    mode: taint
    severity: WARNING
    message: >-
      Untrusted request data is compiled as a regular expression. A pattern such as `(a+)+$` takes exponential time
      on a crafted input and blocks the worker (ReDoS), and the user can change what the expression matches. Escape
      the value with `re.escape` when you mean a literal, or use a regex engine with linear-time matching (`re2`).
    metadata:
      cwe: ["CWE-1333: Inefficient Regular Expression Complexity", "CWE-400: Uncontrolled Resource Consumption"]
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$A
          - pattern: request.$A
          - pattern: request.$A.get(...)
          - pattern: request.$A.getlist(...)
          - pattern: request.$A[...]
          - pattern: request.get_json(...)
          - pattern: request.get_data(...)
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
          - pattern: request.COOKIES.get(...)
          - pattern: request.META.get(...)
          - pattern: self.request.$A
          - patterns:
              - pattern-inside: |
                  @$APP.$METHOD(...)
                  def $F(..., $X, ...):
                      ...
              - pattern: $X
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(get|post|put|delete|patch|route|api_route)$
    pattern-sanitizers:
      # a lookup in a constant allow-list table (SORTABLE.get(value, "name"), ALLOWED[value]) yields our own value
      - patterns:
          - pattern-either:
              - pattern: $TABLE.get(...)
              - pattern: $TABLE[...]
          - metavariable-regex:
              metavariable: $TABLE
              regex: ^[A-Z][A-Z0-9_]*$
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: re.escape(...)
          - pattern: bool(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: re.compile($X, ...)
              - pattern: re.match($X, ...)
              - pattern: re.fullmatch($X, ...)
              - pattern: re.search($X, ...)
              - pattern: re.findall($X, ...)
              - pattern: re.finditer($X, ...)
              - pattern: re.sub($X, ...)
              - pattern: re.subn($X, ...)
              - pattern: re.split($X, ...)
          - focus-metavariable: $X

  # --- LLM applications (OWASP GenAI Top 10 2026: LLM10 Improper Output Handling, LLM05 Excessive Agency) ---------
  # Model output is untrusted: a prompt injection in any document, web page or user message the model reads
  # decides what it writes back.
  - id: gapscan.python.llm-output-code-execution
    languages: [python]
    mode: taint
    severity: ERROR
    message: >-
      Text generated by a language model is run as Python code. Anyone who can put words in front of the model
      (a user message, a retrieved document, a web page) can make it write code that runs with your server's
      rights (OWASP GenAI LLM10 Improper Output Handling). Never `eval`/`exec` model output: have the model return
      structured data validated against a schema, map it to functions you wrote, or run generated code only in an
      isolated sandbox without secrets or network.
    metadata:
      cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')", "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"]
      category: security
      confidence: HIGH
    pattern-sources: &llm-sources
      - pattern-either:
          - pattern: $C.chat.completions.create(...)
          - pattern: $C.chat.completions.parse(...)
          - pattern: $C.completions.create(...)
          - pattern: $C.responses.create(...)
          - pattern: $C.messages.create(...)
          - pattern: $C.chat.complete(...)
          - pattern: $M.generate_content(...)
          - pattern: $C.models.generate_content(...)
          - pattern: ollama.chat(...)
          - pattern: ollama.generate(...)
          - pattern: litellm.completion(...)
          - pattern: completion(..., messages=$MSG, ...)
          - pattern: $LLM.invoke(...)
          - pattern: await $LLM.ainvoke(...)
          - pattern: await $C.chat.completions.create(...)
          - pattern: await $C.messages.create(...)
          - pattern: await $C.responses.create(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)
          - pattern: ast.literal_eval(...)
          - pattern: json.loads(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X, ...)
              - pattern: exec($X, ...)
              - pattern: compile($X, ...)
              - pattern: builtins.eval($X, ...)
              - pattern: builtins.exec($X, ...)
          - focus-metavariable: $X

  - id: gapscan.python.llm-output-shell-command
    languages: [python]
    mode: taint
    severity: ERROR
    message: >-
      Text generated by a language model is run as a shell command. A prompt injection in anything the model reads
      can make it emit `; curl ... | sh` and take over the host (OWASP GenAI LLM10 Improper Output Handling, LLM05
      Excessive Agency). Let the model choose from a fixed list of commands you wrote, pass arguments as a list
      without a shell, validate them, and ask a person to confirm anything destructive.
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command", "CWE-77: Improper Neutralization of Special Elements used in a Command ('Command Injection')"]
      category: security
      confidence: HIGH
    pattern-sources: *llm-sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: shlex.quote(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.system($X)
              - pattern: os.popen($X, ...)
              - pattern: subprocess.$F($X, ..., shell=True, ...)
              - pattern: subprocess.$F(["sh", "-c", $X, ...], ...)
              - pattern: subprocess.$F(["bash", "-c", $X, ...], ...)
              - pattern: subprocess.$F(shlex.split($X), ...)
              - pattern: asyncio.create_subprocess_shell($X, ...)
          - focus-metavariable: $X

  - id: gapscan.python.llm-output-sql
    languages: [python]
    mode: taint
    severity: ERROR
    message: >-
      SQL written by a language model is run against the database. A prompt injection can make the model write
      `DROP TABLE` or read other users' rows (OWASP GenAI LLM10 Improper Output Handling). Run generated SQL only
      on a read-only connection limited to the tables it needs, check it against an allow-list of statement types,
      or have the model fill parameters of queries you wrote.
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      category: security
      confidence: MEDIUM
    pattern-sources: *llm-sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.execute($X, ...)
              - pattern: $C.executemany($X, ...)
              - pattern: $C.executescript($X)
              - pattern: $M.objects.raw($X, ...)
              - pattern: text($X)
              - pattern: sqlalchemy.text($X)
              - pattern: $E.exec_driver_sql($X, ...)
              - pattern: pandas.read_sql($X, ...)
              - pattern: pd.read_sql($X, ...)
          - focus-metavariable: $X

  - id: gapscan.python.llm-agent-dangerous-tool
    languages: [python]
    severity: ERROR
    message: >-
      An LLM agent is given a tool that runs code or shell commands, or a framework safety switch is turned off
      (`allow_dangerous_code=True`). A prompt injection in anything the agent reads can then run commands on this
      machine (OWASP GenAI LLM05 Excessive Agency). Give the agent narrow tools that do one checked thing, or run
      the code tool in an isolated sandbox without secrets or network, and require a person to approve risky steps.
    metadata:
      cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')", "CWE-250: Execution with Unnecessary Privileges"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: $F(..., allow_dangerous_code=True, ...)
      - pattern: PythonREPLTool(...)
      - pattern: PythonAstREPLTool(...)
      - pattern: PythonREPL(...)
      - pattern: ShellTool(...)
      - pattern: BashProcess(...)
      - pattern: load_tools([..., "terminal", ...], ...)
      - pattern: load_tools([..., "python_repl", ...], ...)
      - pattern: create_python_agent(...)

  - id: gapscan.python.llm-agent-unrestricted-requests
    languages: [python]
    severity: WARNING
    message: >-
      An LLM agent may send HTTP requests to any address it chooses (`allow_dangerous_requests=True`). A prompt
      injection can make it call internal services, cloud metadata endpoints or send your data to an attacker
      (server-side request forgery; OWASP GenAI LLM05 Excessive Agency). Restrict the tool to an allow-list of hosts
      and methods, and keep it away from internal networks.
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      category: security
      confidence: HIGH
    pattern: $F(..., allow_dangerous_requests=True, ...)

  - id: gapscan.python.llm-unsafe-index-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      A vector store or chain is loaded with `allow_dangerous_deserialization=True`, which unpickles the files. Whoever
      can replace those files (a shared bucket, a downloaded index) runs code in your process. Load only indexes
      your own code wrote to storage nobody else can change, or rebuild the index from the source documents.
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      category: security
      confidence: MEDIUM
    pattern: $F(..., allow_dangerous_deserialization=True, ...)

  - id: gapscan.python.llm-provider-key-hardcoded
    languages: [python]
    severity: ERROR
    message: >-
      An API key for a model provider (OpenAI, Anthropic, Google, Hugging Face, Groq, Replicate) is written into the
      code. Anyone with the code can spend on your account and read what the key can reach. Read the key from the
      environment or a secret store, and revoke this one in the provider's console.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-regex: (?<![A-Za-z0-9_\-])(sk-ant-[a-z0-9]{2,8}-[A-Za-z0-9_\-]{20,}|sk-(proj-|svcacct-|admin-)?[A-Za-z0-9_\-]{32,}|AIza[0-9A-Za-z_\-]{35}|hf_[A-Za-z0-9]{30,}|gsk_[A-Za-z0-9]{40,}|r8_[A-Za-z0-9]{30,})(?![A-Za-z0-9_\-])
      - pattern-not-regex: (sk-|hf_|gsk_|r8_|AIza)(proj-)?([xX*.]{8,}|(your|my|test|fake|dummy|example)[-_])

  # --- round 3: NoSQL, logs, permissions, cleartext, prompts ---------------------------------------------------------
  - id: gapscan.python.taint-nosql-injection
    languages: [python]
    mode: taint
    severity: ERROR
    message: >-
      A JSON request body (or a value taken from it) is used as a MongoDB query. JSON can carry objects, so a user can
      send `{"$ne": null}` or `{"$where": "..."}` instead of a string and match every document or run JavaScript on
      the server (NoSQL injection). Read each field, check it is a plain string or number (`str(...)`), and build the
      query from those values; never pass `$where` text built from input.
    metadata:
      cwe: ["CWE-943: Improper Neutralization of Special Elements in Data Query Logic"]
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          - pattern: request.get_json(...)
          - pattern: request.json
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.json
          - pattern: json.loads(request.$A, ...)
          - pattern: json.loads(request.$A.decode(...), ...)
          - pattern: await request.json()
    pattern-sanitizers:
      - pattern-either:
          - pattern: str(...)
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)
          - pattern: bson.ObjectId(...)
          - pattern: ObjectId(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $COL.find($X, ...)
              - pattern: $COL.find_one($X, ...)
              - pattern: $COL.find_one_and_update($X, ...)
              - pattern: $COL.find_one_and_delete($X, ...)
              - pattern: $COL.find_one_and_replace($X, ...)
              - pattern: $COL.count_documents($X, ...)
              - pattern: $COL.delete_one($X, ...)
              - pattern: $COL.delete_many($X, ...)
              - pattern: $COL.update_one($X, ...)
              - pattern: $COL.update_many($X, ...)
              - pattern: $COL.aggregate($X, ...)
          - focus-metavariable: $X

  - id: gapscan.python.mongo-where-string-built
    languages: [python]
    severity: ERROR
    message: >-
      A MongoDB `$where` clause is built from a string, so a value in it runs as JavaScript on the database server.
      Replace `$where` with normal query operators (`$eq`, `$gt`, `$regex` with an escaped value).
    metadata:
      cwe: ["CWE-943: Improper Neutralization of Special Elements in Data Query Logic"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: '{..., "$where": f"...{...}...", ...}'
      - pattern: '{..., "$where": $S + ..., ...}'
      - pattern: '{..., "$where": $S % ..., ...}'
      - pattern: '{..., "$where": $S.format(...), ...}'

  - id: gapscan.python.secret-in-log
    languages: [python]
    severity: WARNING
    message: >-
      A password, token or key is written to the log. Logs are kept for a long time, copied to other systems and read
      by many people, so the secret leaks. Log that the value was present (or its last 4 characters), never the
      value itself.
    metadata:
      cwe: ["CWE-532: Insertion of Sensitive Information into Log File"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $LOG.$LVL(f"...{$X}...", ...)
          - pattern: $LOG.$LVL($MSG, ..., $X, ...)
          - pattern: $LOG.$LVL($MSG % $X, ...)
          - pattern: $LOG.$LVL($MSG.format(..., $X, ...), ...)
          - pattern: $LOG.$LVL($MSG + $X, ...)
      - metavariable-regex:
          metavariable: $LVL
          regex: ^(debug|info|warning|warn|error|critical|exception|log)$
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(.*\.)?(log|logger|logging|_log|_logger|log_?\w*|\w*_?logger)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(\w+\.)*(password|passwd|pwd|secret|client_secret|api_?key|access_?token|refresh_?token|auth_?token|id_?token|bearer_?token|private_?key|secret_?key|session_?token|token)$

  - id: gapscan.python.world-writable-permissions
    languages: [python]
    severity: WARNING
    message: >-
      A file or folder is made writable by every user on the machine (and often executable), so another local
      account or process can replace its contents. Give the owner the rights it needs (`0o600` for secrets,
      `0o644`/`0o755` for shared files).
    metadata:
      cwe: ["CWE-732: Incorrect Permission Assignment for Critical Resource"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: os.chmod($P, $M)
          - pattern: os.makedirs($P, $M, ...)
          - pattern: os.makedirs($P, ..., mode=$M, ...)
          - pattern: os.mkdir($P, $M, ...)
          - pattern: os.open($P, $F, $M, ...)
          - pattern: $PATH.chmod($M)
          - pattern: $PATH.mkdir($M, ...)
          - pattern: $PATH.mkdir(..., mode=$M, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^0o?[0-7]?[0-7][0-7][2367]$

  - id: gapscan.python.cleartext-protocol
    languages: [python]
    severity: WARNING
    message: >-
      FTP and Telnet send passwords and data unencrypted, so anyone on the network path can read or change them.
      Use SFTP/SSH (`paramiko`), FTPS (`ftplib.FTP_TLS` with `prot_p()`), or HTTPS.
    metadata:
      cwe: ["CWE-319: Cleartext Transmission of Sensitive Information"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: ftplib.FTP(...)
      - pattern: FTP(...)
      - pattern: telnetlib.Telnet(...)
      - pattern: Telnet(...)

  - id: gapscan.python.taint-llm-prompt-injection
    languages: [python]
    mode: taint
    severity: WARNING
    message: >-
      Untrusted request data is written into the system prompt (or the instructions) of a language model. Text there
      is read as the developer's own instructions, so a user can override them (prompt injection, OWASP GenAI LLM01).
      Keep the system prompt fixed, pass user text only as a user message, and treat everything the model returns
      as untrusted.
    metadata:
      cwe: ["CWE-1427: Improper Neutralization of Input Used for LLM Prompting"]
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$A
          - pattern: request.$A
          - pattern: request.$A.get(...)
          - pattern: request.$A.getlist(...)
          - pattern: request.$A[...]
          - pattern: request.get_json(...)
          - pattern: request.get_data(...)
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
          - pattern: request.COOKIES.get(...)
          - pattern: request.META.get(...)
          - pattern: self.request.$A
          - patterns:
              - pattern-inside: |
                  @$APP.$METHOD(...)
                  def $F(..., $X, ...):
                      ...
              - pattern: $X
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(get|post|put|delete|patch|route|api_route)$
    pattern-sanitizers:
      # a lookup in a constant allow-list table (SORTABLE.get(value, "name"), ALLOWED[value]) yields our own value
      - patterns:
          - pattern-either:
              - pattern: $TABLE.get(...)
              - pattern: $TABLE[...]
          - metavariable-regex:
              metavariable: $TABLE
              regex: ^[A-Z][A-Z0-9_]*$
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '{"role": "system", "content": $X}'
              - pattern: '{"role": "developer", "content": $X}'
              - pattern: $C.messages.create(..., system=$X, ...)
              - pattern: $C.responses.create(..., instructions=$X, ...)
              - pattern: SystemMessage(content=$X, ...)
              - pattern: SystemMessage($X, ...)
              - pattern: ("system", $X)
          - focus-metavariable: $X

  # --- round 5: key sizes, IVs, password hashing, mass assignment, template escaping --------------------------------
  - id: gapscan.python.weak-key-size
    languages: [python]
    severity: ERROR
    message: >-
      An RSA or DSA key shorter than 2048 bits is generated. Such keys can be factored with affordable computing
      power, so signatures can be forged and traffic decrypted. Generate RSA keys of at least 3072 bits (2048 as a
      minimum), or use an elliptic-curve key (`ec.generate_private_key(ec.SECP256R1())`, Ed25519).
    metadata:
      cwe: ["CWE-326: Inadequate Encryption Strength"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: rsa.generate_private_key(..., key_size=$N, ...)
          - pattern: dsa.generate_private_key(key_size=$N, ...)
          - pattern: dsa.generate_private_key($N, ...)
          - pattern: RSA.generate($N, ...)
          - pattern: DSA.generate($N, ...)
          - pattern: Crypto.PublicKey.RSA.generate($N, ...)
          - pattern: rsa.newkeys($N, ...)
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 2048

  - id: gapscan.python.static-iv
    languages: [python]
    severity: ERROR
    message: >-
      The cipher's IV or nonce is a constant written in the code. With a fixed IV the same plaintext encrypts to the
      same ciphertext (CBC), and with a fixed nonce CTR and GCM leak the XOR of messages and let an attacker forge
      them. Generate a fresh random IV or nonce for every message (`os.urandom(16)`, `secrets.token_bytes(12)`)
      and store it next to the ciphertext.
    metadata:
      cwe: ["CWE-1204: Generation of Weak Initialization Vector (IV)", "CWE-329: Generation of Predictable IV with CBC Mode"]
      category: security
      confidence: HIGH
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $AES.new($K, $C.$MODE, b"...", ...)
              - pattern: $AES.new($K, $C.$MODE, "...", ...)
              - pattern: $AES.new($K, $C.$MODE, iv=b"...", ...)
              - pattern: $AES.new($K, $C.$MODE, nonce=b"...", ...)
              - pattern: $AES.new($K, $C.$MODE, b"..." * $N, ...)
          - metavariable-regex:
              metavariable: $MODE
              regex: ^MODE_
      - pattern: modes.CBC(b"...")
      - pattern: modes.CTR(b"...")
      - pattern: modes.GCM(b"...", ...)
      - pattern: modes.CBC(b"..." * $N)
      - pattern: modes.GCM(b"..." * $N, ...)
      - pattern: AESGCM($K).encrypt(b"...", $D, $AAD)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $AEAD = AESGCM(...)
                  ...
              - pattern-inside: |
                  $AEAD = ChaCha20Poly1305(...)
                  ...
          - pattern: $AEAD.encrypt(b"...", $D, $AAD)

  - id: gapscan.python.weak-password-hash
    languages: [python]
    severity: ERROR
    message: >-
      A password is hashed with a fast general-purpose hash (or with too few PBKDF2 iterations). Attackers who get the
      hashes can try billions of guesses per second on a GPU. Use a password hashing function: `argon2-cffi`,
      `bcrypt`, `hashlib.scrypt`, or PBKDF2-HMAC-SHA256 with at least 600,000 iterations.
    metadata:
      cwe: ["CWE-916: Use of Password Hash With Insufficient Computational Effort"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: hashlib.$H($PW, ...)
              - pattern: hashlib.$H($PW.encode(...), ...)
              - pattern: hashlib.$H(($SALT + $PW).encode(...), ...)
              - pattern: hashlib.$H(($PW + $SALT).encode(...), ...)
              - pattern: hashlib.$H($SALT + $PW.encode(...), ...)
              - pattern: hashlib.$H($PW.encode(...) + $SALT, ...)
          - metavariable-regex:
              metavariable: $H
              regex: ^(sha1|sha224|sha256|sha384|sha512|sha3_256|sha3_512|blake2b|blake2s)$
          - metavariable-regex:
              metavariable: $PW
              regex: (?i)^(\w+\.)*(password|passwd|pwd|passphrase|new_password|raw_password|plain_password)$
      - patterns:
          - pattern-either:
              - pattern: hashlib.pbkdf2_hmac($ALG, $P, $S, $N, ...)
              - pattern: hashlib.pbkdf2_hmac($ALG, $P, $S, iterations=$N, ...)
              - pattern: PBKDF2HMAC(..., iterations=$N, ...)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 100000
      - patterns:
          - pattern: bcrypt.gensalt(rounds=$N, ...)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 10

  - id: gapscan.python.mass-assignment
    languages: [python]
    severity: WARNING
    message: >-
      Every field of the request is passed as keyword arguments to a model, so a user can set fields the form never
      offered (`is_admin`, `owner_id`, `balance`). Copy only the allowed fields, or validate the body with a schema
      (a Django form, a pydantic model) that lists them.
    metadata:
      cwe: ["CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $F(..., **request.$A, ...)
              - pattern: $F(..., **request.$A.dict(), ...)
              - pattern: $F(..., **request.$A.to_dict(), ...)
              - pattern: $F(..., **request.get_json(...), ...)
              - pattern: $F(..., **flask.request.get_json(...), ...)
              - patterns:
                  - pattern-inside: |
                      $DATA = request.get_json(...)
                      ...
                  - pattern: $F(..., **$DATA, ...)
              - patterns:
                  - pattern-inside: |
                      $DATA = request.$A
                      ...
                  - pattern: $F(..., **$DATA, ...)
          - pattern-not: $F(..., **request.headers, ...)
          # model constructors and create/update calls
          - metavariable-regex:
              metavariable: $F
              regex: ^([A-Z]\w*|.*\.objects\.(create|update|get_or_create|update_or_create)|.*\.(update|create)|.*\.[A-Z]\w*)$
      - pattern: $OBJ.__dict__.update(request.$A)
      - pattern: $OBJ.__dict__.update(request.get_json(...))
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  for $K, $V in request.$A.items():
                      ...
              - pattern-inside: |
                  for $K, $V in request.get_json(...).items():
                      ...
          - pattern: setattr($OBJ, $K, $V)

  - id: gapscan.python.jinja2-autoescape-default-off
    languages: [python]
    severity: INFO
    message: >-
      A Jinja2 environment is created without `autoescape`, and Jinja2's default is off, so any value rendered into an
      HTML template is not escaped (cross-site scripting). Pass `autoescape=select_autoescape(["html", "xml"])` (or
      `autoescape=True`); leave it off only for templates that never produce HTML.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation"]
      category: security
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: jinja2.Environment(...)
          - pattern: Environment(...)
      - pattern-not: jinja2.Environment(..., autoescape=$A, ...)
      - pattern-not: Environment(..., autoescape=$A, ...)
