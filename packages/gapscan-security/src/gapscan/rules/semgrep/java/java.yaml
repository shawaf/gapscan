  - id: gapscan.java.taint-trust-boundary
    languages: [java]
    mode: taint
    severity: WARNING
    message: >-
      Untrusted request data is stored in the user's session as a key or value. Later code trusts anything in the session, so this lets a user plant data that looks verified (trust boundary violation). Validate the value first, and never use request data as the attribute name.
