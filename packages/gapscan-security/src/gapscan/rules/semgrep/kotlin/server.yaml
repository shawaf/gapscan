      with a `SimpleEvaluationContext` that has no type or bean access.
    metadata:
      cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')", "CWE-917: Improper Neutralization of Special Elements used in an Expression Language Statement ('Expression Language Injection')"]
      masvs: ["MASVS-CODE-4"]
      category: security
      confidence: MEDIUM
    pattern-sources:
