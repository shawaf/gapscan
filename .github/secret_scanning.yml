# GitHub secret scanning: these folders hold deliberately fake, invalid credentials used as
# scanner fixtures and rule tests (same list as .gitleaks.toml). Real secrets must never be added.
paths-ignore:
  - "eval/fixtures/**"
  - "tests/rules/**"
  - "tests/data/**"
  - "packages/gapscan-local/src/gapscan/sample_project/**"
  - "tools/eval_cases/**"
  - "tools/make_eval_fixtures.py"
