# GapScan Rules: Python (web backends, scripts). Licensed Apache-2.0 with the rest of GapScan.
# Every rule has a vulnerable and a safe case in tests/rules/python/python.py (run: make rules-test).
# Taint rules follow request data within one function; they say "untrusted request data" in their message.
rules:
  - id: gapscan.python.sqli-string-built
    languages: [python]
    severity: ERROR
    message: >-
      An SQL statement is built from a string with concatenation, `%`, `.format()` or an f-string. Pass the
      values as bound parameters instead (`cursor.execute("... WHERE id = %s", (value,))`).
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $C.execute($Q % ..., ...)
          - pattern: $C.execute($Q + ..., ...)
          - pattern: $C.execute($Q.format(...), ...)
          - pattern: $C.execute(f"...{...}...", ...)
          - pattern: $C.executemany($Q % ..., ...)
          - pattern: $C.executemany(f"...{...}...", ...)
          - pattern: $M.objects.raw(f"...{...}...")
          - pattern: $M.objects.raw($Q % ...)
          - pattern: $M.objects.raw($Q + ...)
          - pattern: $M.objects.raw($Q.format(...), ...)
          - pattern: $QS.extra(..., where=[..., f"...{...}...", ...], ...)
          - pattern: $QS.extra(..., where=[..., $Q % ..., ...], ...)
          - pattern: $QS.extra(..., where=[..., $Q + ..., ...], ...)
          - pattern: $QS.extra(..., where=[..., $Q.format(...), ...], ...)
          - pattern: RawSQL(f"...{...}...", ...)
          - pattern: RawSQL($Q % ..., ...)
          - pattern: RawSQL($Q + ..., ...)
          - pattern: sqlalchemy.text($Q % ...)
          - pattern: sqlalchemy.text($Q.format(...))
          - pattern: text($Q % ...)
          - pattern: text($Q.format(...))
          - pattern: $E.exec_driver_sql(f"...{...}...", ...)
          - pattern: $E.exec_driver_sql($Q % ..., ...)
          - pattern: $E.exec_driver_sql($Q + ..., ...)
          - pattern: $E.exec_driver_sql($Q.format(...), ...)
          - pattern: $C.executescript(f"...{...}...")
          - pattern: $C.executescript($Q % ...)
          - pattern: $C.executescript($Q + ...)
          - pattern: $C.executescript($Q.format(...))
          - pattern: sqlalchemy.text(f"...{...}...")
          - pattern: text(f"...{...}...")
          - pattern: text($Q + ...)
          # the statement is built into a variable first, then run
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $SQL = f"...{...}..."
                      ...
                  - pattern-inside: |
                      $SQL = "..." % ...
                      ...
                  - pattern-inside: |
                      $SQL = "...".format(...)
                      ...
                  - pattern-inside: |
                      $SQL = "..." + $X + ...
                      ...
                  - pattern-inside: |
                      $SQL = "..." + $X
                      ...
              - pattern-either:
                  - pattern: $C.execute($SQL, ...)
                  - pattern: $C.executemany($SQL, ...)
                  - pattern: $C.executescript($SQL)
                  - pattern: $M.objects.raw($SQL, ...)
                  - pattern: text($SQL)
                  - pattern: sqlalchemy.text($SQL)
                  - pattern: $C.exec_driver_sql($SQL, ...)
              - pattern-not-inside: |
                  $SQL = "..." + "..."
                  ...
      - pattern-not: $C.execute("..." + "...", ...)
      # the only value comes from a constant allow-list table (SORTABLE.get(user_value, "name"))
      - pattern-not-inside:
          patterns:
            - pattern-inside: |
                $COL = $TABLE.get(...)
                ...
            - pattern: $C.execute(<... $COL ...>, ...)
            - metavariable-regex:
                metavariable: $TABLE
                regex: ^[A-Z][A-Z0-9_]*$
      - pattern-not: $C.execute($F(...) + "...", ...)
      # the interpolated part is only a list of bind placeholders: "IN ({','.join('?' * len(ids))})"
      - pattern-not: $C.execute(f"...{$SEP.join(<... "?" ...>)}...", ...)
      - pattern-not: $C.execute(f"...{$SEP.join(<... "%s" ...>)}...", ...)
      - pattern-not-inside: |
          $MARKS = $SEP.join(<... "?" ...>)
          ...
      - pattern-not-inside: |
          $MARKS = $SEP.join(<... "%s" ...>)
          ...

  - id: gapscan.python.command-injection
    languages: [python]
    severity: ERROR
    message: >-
      A shell command is built at run time. If any part comes from a user, they can run their own commands. Pass
      the program and its arguments as a list without `shell=True` (`subprocess.run(["ls", path])`).
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
          - pattern: subprocess.$F($CMD, ..., shell=True, ...)
          - pattern: commands.getoutput($CMD)
          - pattern: subprocess.getoutput($CMD)
          - pattern: subprocess.getstatusoutput($CMD)
          - pattern: asyncio.create_subprocess_shell($CMD, ...)
      - pattern-not: os.system("...")
      - pattern-not: subprocess.getoutput("...")
      - pattern-not: subprocess.getstatusoutput("...")
      - pattern-not: asyncio.create_subprocess_shell("...", ...)
      - pattern-not: os.popen("...", ...)
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)

  - id: gapscan.python.shell-c-dynamic-command
    languages: [python]
    severity: ERROR
    message: >-
      A shell is started with `-c` (or `cmd.exe /c`) and a command string built at run time. Passing an argument list
      does not help here: the shell parses that string, so a user value in it can run its own commands. Run the
      program directly with a list of arguments (`subprocess.run(["echo", value])`), or quote the value with
      `shlex.quote`.
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: subprocess.$F([$SH, "-c", $CMD, ...], ...)
          - pattern: subprocess.$F([$SH, "/c", $CMD, ...], ...)
          - pattern: os.$EXEC($P, [$SH, "-c", $CMD, ...], ...)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $L.append("-c")
                      ...
                      $L.append($CMD)
                      ...
                  - pattern-inside: |
                      if $COND:
                          ...
                      else:
                          ...
                          $L.append("-c")
                      ...
                      $L.append($CMD)
                      ...
                  - pattern-inside: |
                      $L.append("/c")
                      ...
                      $L.append($CMD)
                      ...
                  - pattern-inside: |
                      $L = [$SH, "-c"]
                      ...
                      $L.append($CMD)
                      ...
              - pattern: subprocess.$F($L, ...)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern: $ANY
            - pattern-not: '"..."'
      - pattern-not: subprocess.$F([$SH, "-c", shlex.quote(...), ...], ...)
      - pattern-not: subprocess.$F([$SH, "-c", shlex.join(...), ...], ...)

  - id: gapscan.python.eval-exec
    languages: [python]
    severity: ERROR
    message: >-
      `eval` and `exec` run text as code. If the text can be influenced by a user this is remote code execution.
      Use `ast.literal_eval` for data, or an explicit lookup table for choices.
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)

  - id: gapscan.python.unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      Unpickling (or `marshal`, `dill`, `jsonpickle`, or YAML without a safe loader) can execute code chosen by whoever
      wrote the data. Use JSON for data from outside, or `yaml.safe_load`.
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)
          - pattern: cPickle.load(...)
          - pattern: cPickle.loads(...)
          - pattern: marshal.loads(...)
          - pattern: dill.loads(...)
          - pattern: jsonpickle.decode(...)
          - pattern: yaml.load($X)
          - pattern: yaml.load($X, Loader=yaml.Loader)
          - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)
          - pattern: yaml.load($X, Loader=yaml.FullLoader)
          - pattern: yaml.unsafe_load(...)
          - pattern: yaml.unsafe_load_all(...)
          - pattern: yaml.full_load(...)
          - pattern: yaml.full_load_all(...)
          - pattern: yaml.load($X, Loader=yaml.CLoader)
          - pattern: yaml.load($X, Loader=yaml.CUnsafeLoader)
          - pattern: yaml.load($X, Loader=yaml.CFullLoader)
          - pattern: yaml.load_all($X)
          - pattern: yaml.load_all($X, Loader=yaml.Loader)
          - pattern: yaml.load_all($X, Loader=yaml.UnsafeLoader)
          - pattern: yaml.load_all($X, Loader=yaml.FullLoader)
          - pattern: marshal.load(...)

  - id: gapscan.python.weak-hash
    languages: [python]
    severity: WARNING
    message: >-
      MD5 and SHA-1 are broken for security use. Fine for a cache key or file checksum, not for passwords, signatures
      or tokens: use `hashlib.sha256` (or `hashlib.scrypt`/`argon2` for passwords).
    metadata:
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
          - pattern: Crypto.Hash.MD5.new(...)
          - pattern: MD5.new(...)
      # explicitly not for security (Python 3.9+), or a cache validator / checksum
      - pattern-not: hashlib.md5(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.new($N, ..., usedforsecurity=False, ...)
      - pattern-not-inside:
          patterns:
            - pattern-inside: |
                def $FN(...):
                    ...
            - metavariable-regex:
                metavariable: $FN
                regex: (?i).*(etag|checksum|cache_?key|fingerprint)

  - id: gapscan.python.weak-cipher
    languages: [python]
    severity: ERROR
    message: >-
      A broken cipher (DES, RC4, Blowfish) or ECB mode is used; ECB leaks patterns and DES/RC4 can be broken. Use
      AES-GCM or ChaCha20-Poly1305 (`cryptography` library).
    metadata:
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: $M.new(..., $MODE.MODE_ECB, ...)
      - pattern: DES.new(...)
      - pattern: DES3.new(...)
      - pattern: ARC4.new(...)
      - pattern: Blowfish.new(...)
      - pattern: algorithms.TripleDES(...)
      - pattern: algorithms.ARC4(...)
      - pattern: algorithms.Blowfish(...)
      - pattern: modes.ECB()

  - id: gapscan.python.tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: >-
      Certificate verification is switched off, so anyone on the network path can read and change the traffic. Remove
      `verify=False` / unverified contexts and fix the certificate (or point `verify` at the right CA file).
    metadata:
      cwe: ["CWE-295: Improper Certificate Validation"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: requests.$F(..., verify=False, ...)
      - pattern: $S.$F(..., verify=False, ...)
      - pattern: httpx.$F(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: ssl._create_default_https_context = ssl._create_unverified_context
      - pattern: $CTX.check_hostname = False
      - pattern: $CTX.verify_mode = ssl.CERT_NONE
      - pattern: ssl.wrap_socket(...)
      - pattern: urllib3.disable_warnings(...)

  - id: gapscan.python.hardcoded-secret
    languages: [python]
    severity: WARNING
    message: >-
      A password, key or token is written into the source. Anyone with the code has it, and it stays in the git
      history. Read it from the environment or a secret store, and rotate the value.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $N = "..."
          - pattern: $N = b"..."
          - pattern: '{..., "$N": "...", ...}'
          - pattern: $F(..., $N="...", ...)
      - metavariable-regex:
          metavariable: $N
          regex: (?i)^(.*[_-])?(password|passwd|pwd|secret|api_?key|apikey|access_?key|secret_?key|private_?key|auth_?token|token|client_secret)([_-].*)?$
      - pattern-not: $N = ""
      - pattern-not: $N = "..." + "..."
      - pattern-not-regex: (?i)=\s*b?["'](changeme|change-me|your[_-].*|<.*>|\*+|x+|example|placeholder|test|none|null|todo|password|secret|token|key|api_?key)["']
      - pattern-not-regex: (?i)(token|password|secret)_?(url|file|path|endpoint|header|field|name|type|length|prefix|expiry|ttl)\s*=

  - id: gapscan.python.debug-enabled
    languages: [python]
    severity: WARNING
    message: >-
      Debug mode shows stack traces and, in Flask, an interactive console that runs code. Never enable it in a
      deployed app: read the setting from the environment and keep it off by default.
    metadata:
      cwe: ["CWE-489: Active Debug Code"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: DEBUG = True
      - pattern: app.debug = True

  - id: gapscan.python.jwt-verification-off
    languages: [python]
    severity: ERROR
    message: >-
      The JWT is accepted without checking its signature (or with the `none` algorithm), so anyone can forge a token
      for any user. Always verify with a fixed list of expected algorithms.
    metadata:
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: jwt.decode(..., verify=False, ...)
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: jwt.decode(..., algorithms=[..., "none", ...], ...)
      - pattern: jwt.encode(..., algorithm="none", ...)

  - id: gapscan.python.insecure-random-token
    languages: [python]
    severity: WARNING
    message: >-
      `random` is predictable, so a token, password, key or code made with it can be guessed. Use the `secrets`
      module (`secrets.token_urlsafe()`, `secrets.choice()`).
    metadata:
      cwe: ["CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $N = random.$F(...)
          - pattern: $N = "".join(random.$F(...) for $_ in ...)
          - pattern: $N = "".join([random.$F(...) for $_ in ...])
          - pattern: $N = str(random.$F(...))
      - metavariable-regex:
          metavariable: $N
          regex: (?i).*(token|password|passwd|secret|otp|nonce|session|api_?key|reset|csrf|salt|code|pin).*

  - id: gapscan.python.xxe-enabled
    languages: [python]
    severity: ERROR
    message: >-
      The XML parser resolves external entities, so a crafted document can read local files or reach internal
      servers. Keep `resolve_entities=False` (and `no_network=True`), or parse with `defusedxml`.
    metadata:
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: etree.XMLParser(..., resolve_entities=True, ...)
      - pattern: lxml.etree.XMLParser(..., resolve_entities=True, ...)
      - pattern: $P.setFeature(xml.sax.handler.feature_external_ges, True)

  - id: gapscan.python.insecure-temp-file
    languages: [python]
    severity: WARNING
    message: >-
      `tempfile.mktemp` returns a name that another process can claim before you create the file (a race that lets
      an attacker redirect your writes). Use `tempfile.mkstemp()` or `NamedTemporaryFile()`.
    metadata:
      cwe: ["CWE-377: Insecure Temporary File"]
      category: security
      confidence: HIGH
    pattern: tempfile.mktemp(...)

  - id: gapscan.python.unsafe-html-marking
    languages: [python]
    severity: WARNING
    message: >-
      The value is marked as safe HTML (or Jinja auto-escaping is turned off), so any markup in it runs in the user's
      browser. Escape the value, or only mark text you wrote yourself as safe.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation"]
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: mark_safe($X)
          - pattern: django.utils.safestring.mark_safe($X)
          - pattern: Markup($X)
          - pattern: markupsafe.Markup($X)
          - pattern: jinja2.Environment(..., autoescape=False, ...)
          - pattern: Environment(..., autoescape=False, ...)
      - pattern-not: mark_safe("...")
      - pattern-not: Markup("...")

  - id: gapscan.python.cookie-flags-off
    languages: [python]
    severity: WARNING
    message: >-
      A session or auth cookie is sent without `Secure` or `HttpOnly`, so it travels over plain HTTP or can be read by
      page scripts. Turn both on (and set `SameSite`).
    metadata:
      cwe: ["CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: $R.set_cookie(..., secure=False, ...)
      - pattern: $R.set_cookie(..., httponly=False, ...)
      - pattern: SESSION_COOKIE_SECURE = False
      - pattern: SESSION_COOKIE_HTTPONLY = False
      - pattern: CSRF_COOKIE_SECURE = False

  - id: gapscan.python.csrf-protection-off
    languages: [python]
    severity: WARNING
    message: >-
      CSRF protection is turned off for this view or app, so another site can make a logged-in user's browser submit
      requests. Keep the protection on and send the CSRF token from the form, or use token headers that a browser
      does not add by itself.
    metadata:
      cwe: ["CWE-352: Cross-Site Request Forgery (CSRF)"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: |
          @csrf_exempt
          def $F(...): ...
      - pattern: |
          @csrf_exempt
          class $C: ...
      - pattern: WTF_CSRF_ENABLED = False
      - pattern: $APP.config["WTF_CSRF_ENABLED"] = False

  - id: gapscan.python.cors-allow-all
    languages: [python]
    severity: WARNING
    message: >-
      Every website is allowed to call this API from a browser. Allow only the origins that need it, and never
      combine a wildcard with credentials.
    metadata:
      cwe: ["CWE-942: Permissive Cross-domain Policy with Untrusted Domains"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: CORS($APP, ..., origins="*", ...)
      - pattern: 'CORS($APP, ..., resources={..., "...": {..., "origins": "*", ...}, ...}, ...)'
      - pattern: CORS_ALLOW_ALL_ORIGINS = True
      - pattern: CORS_ORIGIN_ALLOW_ALL = True
      - pattern: $R.headers["Access-Control-Allow-Origin"] = "*"
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)

  - id: gapscan.python.ssh-host-key-not-checked
    languages: [python]
    severity: ERROR
    message: >-
      Unknown SSH servers are trusted automatically, which allows a man-in-the-middle to read credentials and data.
      Load known host keys and reject unknown ones (`RejectPolicy`).
    metadata:
      cwe: ["CWE-295: Improper Certificate Validation"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: $C.set_missing_host_key_policy(paramiko.AutoAddPolicy(...))
      - pattern: $C.set_missing_host_key_policy(AutoAddPolicy(...))
      - pattern: $C.set_missing_host_key_policy(paramiko.WarningPolicy(...))

  - id: gapscan.python.weak-random-generator
    languages: [python]
    severity: INFO
    message: >-
      The `random` module is predictable. That is fine for a shuffle or a simulation, but anything an attacker must
      not guess (a token, key, password, id or code) needs the `secrets` module. Check what this value is used for.
    metadata:
      cwe: ["CWE-330: Use of Insufficiently Random Values", "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator"]
      category: security
      confidence: LOW
    patterns:
      - pattern: random.$F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(random|randint|randrange|choice|choices|sample|getrandbits|uniform|triangular|betavariate|expovariate|gammavariate|gauss|lognormvariate|normalvariate|vonmisesvariate|paretovariate|weibullvariate|randbytes)$

  - id: gapscan.python.ldap-filter-string-built
    languages: [python]
    severity: ERROR
    message: >-
      An LDAP search filter is built from a string, so a user value such as `*)(uid=*` changes what the query matches
      (LDAP injection). Escape the value (`ldap3.utils.conv.escape_filter_chars`) before putting it in a filter.
    metadata:
      cwe: ["CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"]
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: $C.search($B, f"...{...}...", ...)
      - pattern: $C.search($B, $F + ..., ...)
      - pattern: $C.search($B, $F % ..., ...)
      - pattern: $C.search($B, $F.format(...), ...)
      - pattern: $C.search_s($B, $SCOPE, f"...{...}...", ...)
      - pattern: $C.search_s($B, $SCOPE, $F + ..., ...)

  - id: gapscan.python.xpath-string-built
    languages: [python]
    severity: ERROR
    message: >-
      An XPath expression is built from a string, so a user value can change what it selects (XPath injection). Pass
      values as variables (`tree.xpath("//u[@id=$id]", id=value)`) instead of formatting them into the expression.
    metadata:
      cwe: ["CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $T.xpath(f"...{...}...", ...)
          - pattern: $T.xpath($Q + ..., ...)
          - pattern: $T.xpath($Q % ..., ...)
          - pattern: $T.xpath($Q.format(...), ...)
          - pattern: elementpath.select($R, f"...{...}...", ...)
          - pattern: elementpath.select($R, $Q + ..., ...)
          - pattern: elementpath.select($R, $Q % ..., ...)
          - pattern: elementpath.select($R, $Q.format(...), ...)
          - pattern: etree.XPath(f"...{...}...")
          - pattern: etree.XPath($Q + ...)
      # the only interpolated value has its delimiting quote escaped
      - pattern-not: $T.xpath(f"...{$V.replace("'", $E)}...", ...)
      - pattern-not: elementpath.select($R, f"...{$V.replace("'", $E)}...", ...)
      - pattern-not: etree.XPath(f"...{$V.replace("'", $E)}...")
      # a value containing a quote was rejected earlier
      - pattern-not-inside: |
          if "'" in $V:
              ...
          ...

  # --- taint rules: untrusted request data reaching a dangerous call inside one function -----------------
  - id: gapscan.python.taint-sqli
    languages: [python]
    mode: taint
    severity: ERROR
    message: >-
      Untrusted request data reaches an SQL statement built from a string. Use bound parameters.
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      category: security
      confidence: HIGH
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$A
          - pattern: request.$A
          - pattern: request.$A.get(...)
          - pattern: request.$A.getlist(...)
          - pattern: request.$A[...]
          - pattern: request.get_json(...)
          - pattern: request.get_data(...)
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
          - pattern: request.COOKIES.get(...)
          - pattern: request.META.get(...)
          - pattern: self.request.$A
          - patterns:
              - pattern-inside: |
                  @$APP.$METHOD(...)
                  def $F(..., $X, ...):
                      ...
              - pattern: $X
