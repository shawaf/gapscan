name: Rule request
description: Suggest a pattern GapScan should detect (or offer to write the rule).
labels: [rules]
body:
  - type: input
    id: language
    attributes:
      label: Language and framework
      placeholder: Python / FastAPI
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: Vulnerable code and its safe version
      render: text
    validations:
      required: true
  - type: input
    id: cwe
    attributes:
      label: CWE or OWASP control (if you know it)
      placeholder: CWE-89, ASVS V1.2.4
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to write this rule myself (see docs/writing-rules.md)
